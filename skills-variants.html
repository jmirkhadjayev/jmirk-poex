<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Skills — 12 ta dizayn varianti</title>
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<style>
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BB-02FF}
:root{
  --bg:#e7eeea;--panel:#fff;--surface:#f3f6f8;--surface2:#e9eef1;--border:rgba(15,23,30,.12);
  --text:#15181d;--muted:#454b54;--accent:#0f9d4f;--accent-text:#0a7d3f;--fill:#18d26e;--soft:rgba(24,210,110,.14);
  --ease:cubic-bezier(.22,1,.36,1);--font:"M PLUS 1 Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  background-image:linear-gradient(rgba(15,157,79,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,157,79,.06) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
img{display:block}

/* ---------- page chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top h1 b{color:var(--accent)}
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--panel)}
.jump a:hover,.jump a.on{background:var(--text);color:#fff;border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.intro{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px;max-width:820px}
.intro b{color:var(--text)}

.var{background:var(--panel);border-radius:20px;margin-bottom:28px;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -30px rgba(15,23,30,.45);scroll-margin-top:70px}
.var::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--fill),#9be8c0 60%,transparent)}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:18px 24px 14px;border-bottom:1px dashed var(--border);background:#fbfcfb}
.vh .n{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--accent-text);font-weight:700;display:flex;align-items:center;justify-content:center}
.vh h2{font-size:17px;margin:0}
.vh .tag{font-size:10.5px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:3px 9px;border-radius:99px}
.vh p{width:100%;margin:2px 0 0 40px;font-size:12.5px;color:var(--muted);line-height:1.55}
.vb{padding:26px 24px 30px}
/* site section title replica */
.st{display:flex;align-items:center;gap:12px;margin:0 0 22px}
.st h3{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0;text-transform:uppercase}
.st::after{content:"";width:48px;height:3px;background:var(--accent);border-radius:2px}
@media(max-width:640px){.vh p{margin-left:0}.vb{padding:20px 16px 24px}.st h3{font-size:24px}}

/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.in .rv,.rv.in{opacity:1;transform:none}

/* shared chip (current style) */
.chip{display:flex;flex-direction:column;align-items:center;gap:9px;width:92px;padding:16px 8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 4px 14px -12px rgba(15,23,30,.3);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s,background .25s}
.chip:hover{transform:translateY(-5px);background:#fff;border-color:rgba(15,157,79,.5);box-shadow:0 16px 28px -18px rgba(15,157,79,.45)}
.ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;filter:grayscale(1);transition:filter .3s,transform .25s var(--ease)}
.ico img{width:100%;height:100%;object-fit:contain}
.ico i{font-size:34px;line-height:1;color:#3b82f6}
.chip:hover .ico,.colorful .ico{filter:none}
.chip:hover .ico{transform:scale(1.12)}
.chip span{font-size:12.5px;font-weight:500;text-align:center;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.radar-wrap{text-align:center;margin-top:26px}
.radar-wrap h4{font-size:16px;margin:0 0 4px}
.radar-wrap h4::after{content:"";display:block;width:40px;height:3px;margin:8px auto 0;background:var(--accent);border-radius:2px}
svg.radar{width:100%;max-width:520px;height:auto}
svg.radar text{font-family:var(--font);font-size:11px;font-weight:600;fill:var(--muted)}

/* ---------- V1 grouped ---------- */
.v1{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center}
.v1 .grp{margin-bottom:18px}
.v1 .grp h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.v1 .grp h5::after{content:"";flex:1;height:1px;background:var(--border)}
.v1 .row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;transition:.25s var(--ease)}
.pill .ico{width:22px;height:22px}.pill .ico i{font-size:19px}
.pill:hover{border-color:rgba(15,157,79,.5);background:#fff;transform:translateY(-2px)}
.pill:hover .ico{filter:none}
@media(max-width:820px){.v1{grid-template-columns:1fr}}

/* ---------- V2 level dots ---------- */
.v2 .chip{width:118px;padding:16px 10px 14px;position:relative}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--border)}
.dots i.f{background:var(--fill);border-color:var(--fill)}
.yrs{font-size:10.5px;color:var(--muted)}
.lvl-legend{display:flex;justify-content:center;gap:16px;font-size:11.5px;color:var(--muted);margin-top:16px}

/* ---------- V3 bars ---------- */
.v3{display:grid;grid-template-columns:1fr 1fr;gap:10px 36px}
.bar{display:grid;grid-template-columns:28px 1fr 44px;gap:10px;align-items:center}
.bar .ico{width:24px;height:24px;filter:none}.bar .ico i{font-size:20px}
.bar .lb{font-size:13px;font-weight:600;margin-bottom:5px;display:block}
.bar .tr{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--fill));transition:width 1.2s var(--ease)}
.bar .pc{font-size:12.5px;font-weight:700;color:var(--accent-text);text-align:right}
.v3h{grid-column:1/-1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--border)}
@media(max-width:720px){.v3{grid-template-columns:1fr}}

/* ---------- V4 bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(110px,auto);gap:12px}
.bt{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:.25s var(--ease)}
.bt:hover{border-color:rgba(15,157,79,.45);background:#fff}
.bt.main{grid-column:span 2;grid-row:span 2;background:radial-gradient(400px 260px at 0 0,rgba(24,210,110,.16),transparent 60%),var(--surface)}
.bt.main .ics{display:flex;gap:14px;margin:14px 0}
.bt.main .ics .ico{width:54px;height:54px;filter:none}
.bt.main h4{font-size:22px;margin:0 0 6px}
.bt.main p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.bt .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bt.sm{display:flex;flex-direction:column;justify-content:space-between}
.bt.sm .ico{width:30px;height:30px}
.bt.sm b{font-size:14px}
.bt.rad{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;align-items:center}
.bt.rad svg{max-width:380px}
.bt.wide{grid-column:span 2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bento{grid-template-columns:1fr 1fr}.bt.main,.bt.rad,.bt.wide{grid-column:span 2}}

/* ---------- V5 gauges ---------- */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.g{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 10px}
.g svg{width:96px;height:96px;transform:rotate(-90deg)}
.g .bgc{fill:none;stroke:var(--surface2);stroke-width:9}
.g .fgc{fill:none;stroke:url(#gGrad);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.4s var(--ease)}
.g .val{margin-top:-62px;height:62px;font-size:20px;font-weight:700}
.g .lb{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.3}
@media(max-width:760px){.gauges{grid-template-columns:repeat(2,1fr)}}

/* ---------- V6 orbit ---------- */
.orbit{position:relative;width:min(460px,100%);aspect-ratio:1;margin:0 auto}
.ring{position:absolute;border:1px dashed rgba(15,157,79,.35);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.r1{width:56%;height:56%}.r2{width:94%;height:94%}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#2be38a,var(--accent));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;box-shadow:0 20px 40px -14px rgba(15,157,79,.6)}
.core b{font-size:clamp(20px,4vw,30px)}.core small{font-size:10px;opacity:.85;font-weight:500}
.spin{position:absolute;inset:0;animation:spin 40s linear infinite}
.spin.rev{animation-duration:60s;animation-direction:reverse}
.orbit:hover .spin{animation-play-state:paused}
.sat{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:16px;background:#fff;border:1px solid var(--border);box-shadow:0 10px 20px -12px rgba(15,23,30,.4);display:flex;align-items:center;justify-content:center}
.sat .ico{width:30px;height:30px;filter:none;animation:spin 40s linear infinite reverse}
.spin.rev .sat .ico{animation:spin 60s linear infinite}
.orbit:hover .sat .ico{animation-play-state:paused}
.sat[title]:hover{border-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.v6cap{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- V7 marquee ---------- */
.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);padding:6px 0}
.mq .tr{display:flex;gap:12px;width:max-content;animation:mq 30s linear infinite}
.mq.rev .tr{animation-direction:reverse}
.mq:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq .pill{padding:11px 16px 11px 12px;font-size:14px}
.mq .pill .ico{width:26px;height:26px;filter:none}
.mq .cp{padding:10px 16px;border-radius:12px;border:1px dashed rgba(15,157,79,.45);background:var(--soft);font-size:13px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.mq .cp b{color:var(--text);margin-left:6px}

/* ---------- V8 terminal ---------- */
.term{background:#0d1117;border-radius:14px;overflow:hidden;border:1px solid #1f2937;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.term .bar8{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#161b22;border-bottom:1px solid #1f2937}
.term .bar8 i{width:11px;height:11px;border-radius:50%}
.term .bar8 span{margin-left:auto;font-size:11.5px;color:#8b949e}
.term pre{margin:0;padding:18px 20px;font-family:var(--font);font-size:13.5px;line-height:1.7;color:#c9d1d9;white-space:pre-wrap;min-height:420px}
.c-p{color:#3fb950}.c-k{color:#79c0ff}.c-s{color:#a5d6ff}.c-n{color:#ffa657}.c-m{color:#8b949e}.c-g{color:#18d26e}
.cur{display:inline-block;width:8px;height:16px;background:#18d26e;vertical-align:-3px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* ---------- V9 tabs ---------- */
.tabs9{display:flex;justify-content:center;gap:6px;margin-bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:5px;width:max-content;max-width:100%;margin-inline:auto;flex-wrap:wrap}
.tabs9 button{font-family:inherit;font-size:13px;font-weight:600;border:0;background:transparent;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--muted);transition:.2s}
.tabs9 button.on{background:#fff;color:var(--text);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
.tabs9 button .c{font-size:10.5px;background:var(--soft);color:var(--accent-text);border-radius:99px;padding:1px 7px;margin-left:5px}
.pane{display:none;animation:fade .45s var(--ease)}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.tool i{font-size:22px;color:var(--accent)}
.tool b{display:block;font-size:13.5px}.tool small{font-size:11.5px;color:var(--muted)}

/* ---------- V10 linked ---------- */
.v10{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center}
.v10 .chips{justify-content:flex-start}
.v10 .chip{width:96px;cursor:pointer}
.v10 .chip.act{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,210,110,.2)}
.v10 .chip.act .ico{filter:none}
.v10 .hint{font-size:12px;color:var(--muted);margin-top:14px;min-height:36px;line-height:1.5}
.v10 .hint b{color:var(--accent-text)}
svg.radar .ax.hl text{fill:var(--accent-text);font-weight:700}
svg.radar .ax.hl line{stroke:var(--accent)}
svg.radar .pt.hl{r:7;fill:var(--accent)}
@media(max-width:820px){.v10{grid-template-columns:1fr}.v10 .chips{justify-content:center}}

/* ---------- V11 periodic ---------- */
.ptable{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:760px;margin:0 auto}
.el{aspect-ratio:1;border-radius:12px;padding:10px;display:flex;flex-direction:column;position:relative;border:2px solid;transition:transform .25s var(--ease),box-shadow .25s;background:#fff}
.el:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 18px 28px -18px rgba(0,0,0,.35)}
.el .no{font-size:11px;font-weight:600;opacity:.7}
.el .sy{font-size:clamp(24px,4.5vw,38px);font-weight:700;line-height:1;margin:auto 0 4px}
.el .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .ico{position:absolute;right:9px;top:9px;width:20px;height:20px;filter:none;opacity:.85}
.el .ico i{font-size:17px}
.el.Backend{border-color:#0f9d4f;color:#0a7d3f;background:#effcf4}
.el.Frontend{border-color:#3b82f6;color:#1d4ed8;background:#eff6ff}
.el.Data{border-color:#8b5cf6;color:#6d28d9;background:#f5f3ff}
.el.Tools{border-color:#f59e0b;color:#b45309;background:#fffbeb}
.plegend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:12px}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.plegend i{width:12px;height:12px;border-radius:4px;border:2px solid}
@media(max-width:560px){.ptable{grid-template-columns:repeat(3,1fr)}}

/* ---------- V12 timeline ---------- */
.tl{position:relative;padding:40px 0 10px;overflow-x:auto}
.tl .line{position:absolute;left:0;right:0;top:94px;height:3px;background:linear-gradient(90deg,var(--surface2),var(--fill));border-radius:2px;min-width:760px}
.tl .cols{display:grid;grid-template-columns:repeat(5,1fr);min-width:760px;position:relative}
.tl .yc{text-align:center}
.tl .yr{font-size:22px;font-weight:700;margin-bottom:26px}
.tl .dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin:0 auto 18px;position:relative;z-index:1}
.tl .now .dot{background:var(--fill);box-shadow:0 0 0 6px rgba(24,210,110,.22)}
.tl .stk{display:flex;flex-direction:column;align-items:center;gap:8px}
.tl .stk .pill{font-size:12.5px}
.tl .stk .pill .ico{filter:none}
.tl .ctx{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4;max-width:140px;margin-inline:auto}

.note{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;margin-top:18px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>Skills — <b>12</b> variant</h1>
  <nav class="jump" id="jump"></nav>
</div></div>

<div class="wrap">
  <p class="intro">Saytingizdagi <b>Skills</b> bo'limi uchun 12 xil dizayn. Hammasi saytning o'z ranglari, shrifti (M PLUS 1 Code) va panel uslubida qilingan — to'g'ridan-to'g'ri qo'yish mumkin. Eng tepada solishtirish uchun <b>hozirgi</b> ko'rinish. Har bir variantning o'z manzili bor (masalan <code>#v5</code>).</p>
  <div id="variants"></div>
</div>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9d4f"/><stop offset="1" stop-color="#18d26e"/></linearGradient></defs></svg>

<script>
/* ---- data (same as the site) ---- */
const SK=[
 {n:"HTML",ic:"html5",g:"Frontend",lv:3,y:2021,sy:"Ht"},
 {n:"CSS",ic:"css3",g:"Frontend",lv:3,y:2021,sy:"Cs"},
 {n:"JavaScript",ic:"javascript",g:"Frontend",lv:2,y:2021,sy:"Js"},
 {n:"Java",ic:"java",g:"Backend",lv:3,y:2021,sy:"Jv"},
 {n:"Spring Boot",ic:"spring",g:"Backend",lv:3,y:2022,sy:"Sb"},
 {n:"Python",ic:"python",g:"Backend",lv:2,y:2023,sy:"Py"},
 {n:"PostgreSQL",ic:"postgresql",g:"Data",lv:2,y:2022,sy:"Pg"},
 {n:"Claude",ic:"claude",g:"Tools",lv:3,y:2024,sy:"Cl"},
 {n:"Cloud",ic:null,g:"Tools",lv:2,y:2023,sy:"Cd"},
 {n:"GitHub",ic:"github",g:"Tools",lv:3,y:2021,sy:"Gh"}
];
const COMP=[["Programming Proficiency",85],["Debugging Skills",80],["Version Control",85],["Database Management",80],["Code Testing",70],["Problem Solving",88],["API Integration",82],["Basic Security Knowledge",72]];
const GN={Frontend:"Frontend",Backend:"Backend",Data:"Ma'lumotlar bazasi",Tools:"Vositalar & AI"};
const LINK={ /* skill → competencies it feeds (V10) */
 HTML:[0],CSS:[0],JavaScript:[0,1,6],Java:[0,1,5],"Spring Boot":[0,6,7],Python:[0,5],PostgreSQL:[3],Claude:[1,4,5],Cloud:[6,7],GitHub:[2,4]};

const ico=(s,cls="")=>`<span class="ico ${cls}">${s.ic?`<img src="assets/img/skills/${s.ic}.svg" alt="">`:`<i class="bi bi-cloud-fill"></i>`}</span>`;
const chip=s=>`<div class="chip">${ico(s)}<span>${s.n}</span></div>`;
const pill=s=>`<span class="pill">${ico(s)}${s.n}</span>`;
const title=t=>`<div class="st"><h3>${t}</h3></div>`;
const by=g=>SK.filter(s=>s.g===g);

/* radar generator (same geometry idea as the site) */
function radar(id,size=520){
  const cx=size/2,cy=size/2-10,R=size*0.3,n=COMP.length,ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const P=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let g="";
  for(let l=1;l<=4;l++){g+=`<polygon points="${COMP.map((_,i)=>P(i,R*l/4).join(",")).join(" ")}" fill="none" stroke="#e3e9ed"/>`}
  COMP.forEach(([lb],i)=>{const [x,y]=P(i,R),[tx,ty]=P(i,R+28);const a=Math.abs(tx-cx)<8?"middle":tx>cx?"start":"end";
    const words=lb.length>18?[lb.split(" ").slice(0,2).join(" "),lb.split(" ").slice(2).join(" ")]:[lb];
    g+=`<g class="ax" data-i="${i}"><line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3e9ed"/><text x="${tx}" y="${ty-(words.length-1)*6}" text-anchor="${a}" dominant-baseline="middle">${words.map((w,k)=>`<tspan x="${tx}" dy="${k?13:0}">${w}</tspan>`).join("")}</text></g>`});
  const pts=COMP.map(([,v],i)=>P(i,R*v/100));
  g+=`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(24,210,110,.18)" stroke="#0f9d4f" stroke-width="2"/>`;
  pts.forEach((p,i)=>g+=`<circle class="pt" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#18d26e" stroke="#fff" stroke-width="1.5"><title>${COMP[i][0]}: ${COMP[i][1]}%</title></circle>`);
  return `<svg class="radar" id="${id||""}" viewBox="-80 0 ${size+160} ${size-20}" role="img" aria-label="Core competencies radar chart">${g}</svg>`;
}

/* reveal + per-variant animations */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const s=e.target;s.classList.add("in");
  s.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(i*50)+"ms"});
  s.querySelectorAll(".fl").forEach(f=>f.style.width=f.dataset.w+"%");
  s.querySelectorAll(".fgc").forEach(c=>c.style.strokeDashoffset=264*(1-c.dataset.v/100));
  if(s.id==="v8") typeTerm();
  io.unobserve(s)}),{threshold:.15});
document.querySelectorAll(".var").forEach(s=>io.observe(s));

/* active jump link */
const links=[...document.querySelectorAll(".jump a")];
addEventListener("scroll",()=>{let cur=V[0].id;V.forEach(v=>{const el=document.getElementById(v.id);if(el.getBoundingClientRect().top<160)cur=v.id});
  links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur))},{passive:true});

/* V8 terminal typing */
let typed=false;
function typeTerm(){ if(typed)return; typed=true;
  const out=document.getElementById("termOut");
  const json=`<span class="c-m">{</span>\n  <span class="c-k">"backend"</span>:  [<span class="c-s">"Java"</span>, <span class="c-s">"Spring Boot"</span>, <span class="c-s">"Python"</span>],\n  <span class="c-k">"frontend"</span>: [<span class="c-s">"HTML"</span>, <span class="c-s">"CSS"</span>, <span class="c-s">"JavaScript"</span>],\n  <span class="c-k">"data"</span>:     [<span class="c-s">"PostgreSQL"</span>],\n  <span class="c-k">"tools"</span>:    [<span class="c-s">"GitHub"</span>, <span class="c-s">"Cloud"</span>, <span class="c-s">"Claude"</span>]\n<span class="c-m">}</span>\n\n`;
  const bars=COMP.map(([l,v])=>`  ${l.padEnd(26," ")} <span class="c-g">${"█".repeat(Math.round(v/5))}</span><span class="c-m">${"░".repeat(20-Math.round(v/5))}</span> <span class="c-n">${v}%</span>`).join("\n");
  const cmd1="cat skills.json", cmd2="skills --chart";
  let html="", i=0;
  const prompt='<span class="c-p">➜</span> <span class="c-k">~/skills</span> ';
  const step=(cmd,after,next)=>{ let k=0; const t=setInterval(()=>{ out.innerHTML=html+prompt+cmd.slice(0,++k)+'<span class="cur"></span>'; if(k>=cmd.length){clearInterval(t); html+=prompt+cmd+"\n"+after; out.innerHTML=html+'<span class="cur"></span>'; setTimeout(next,450);} },55); };
  step(cmd1,json,()=>step(cmd2,bars+"\n\n",()=>{out.innerHTML=html+prompt+'<span class="cur"></span>'}));
}

/* V9 tabs */
document.querySelectorAll(".tabs9 button").forEach(b=>b.addEventListener("click",()=>{
  const box=b.closest(".vb");box.querySelectorAll(".tabs9 button").forEach(x=>x.classList.toggle("on",x===b));
  box.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.p===b.dataset.p));}));

/* V10 linked radar */
const r10=document.getElementById("v10radar"), hint=document.getElementById("v10hint");
document.querySelectorAll("#v10chips .chip").forEach(c=>c.addEventListener("click",()=>{
  const on=!c.classList.contains("act");
  document.querySelectorAll("#v10chips .chip").forEach(x=>x.classList.remove("act"));
  r10.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  if(!on){hint.innerHTML="👆 Biror texnologiyani bosing";return;}
  c.classList.add("act"); const idx=LINK[c.dataset.n]||[];
  idx.forEach(i=>{r10.querySelector(`.ax[data-i="${i}"]`).classList.add("hl");r10.querySelector(`.pt[data-i="${i}"]`).classList.add("hl")});
  hint.innerHTML=`<b>${c.dataset.n}</b> → ${idx.map(i=>COMP[i][0]).join(", ")}`;
}));
</script>
