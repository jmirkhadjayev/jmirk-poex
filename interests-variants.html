<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Interests & Hobbies — 20 ta variant</title>
<link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BB-02FF}
:root{
  --bg:#e7eeea;--panel:#fff;--surface:#f3f6f8;--surface2:#e9eef1;--border:rgba(15,23,30,.12);
  --text:#15181d;--muted:#454b54;--accent:#0f9d4f;--accent-text:#0a7d3f;--fill:#18d26e;--soft:rgba(24,210,110,.14);
  --mind:#3b82f6;--mind-s:#eaf2ff;--body:#0f9d4f;--body-s:#e7f8ee;--art:#ec4899;--art-s:#fdeef6;
  --ease:cubic-bezier(.22,1,.36,1);--font:"M PLUS 1 Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  background-image:linear-gradient(rgba(15,157,79,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,157,79,.06) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;margin:0;white-space:nowrap}.top h1 b{color:var(--accent)}
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--panel)}
.jump a:hover,.jump a.on{background:var(--text);color:#fff;border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.intro{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px;max-width:900px}.intro b{color:var(--text)}
.var{background:var(--panel);border-radius:20px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 18px 40px -30px rgba(15,23,30,.45);scroll-margin-top:70px}
.var::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--fill),#9be8c0 60%,transparent);z-index:3}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px 12px;border-bottom:1px dashed var(--border);background:#fbfcfb}
.vh .n{min-width:34px;height:28px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--accent-text);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.vh h2{font-size:16px;margin:0}
.vh .tag{font-size:10.5px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:3px 9px;border-radius:99px}
.vh p{width:100%;margin:0 0 0 44px;font-size:12px;color:var(--muted);line-height:1.5}
.vb{padding:20px 22px 24px;position:relative}
.ttl{display:flex;align-items:center;gap:12px;margin:0 0 16px;position:relative;z-index:2}
.ttl h3{font-size:26px;font-weight:700;margin:0;text-transform:uppercase}
.ttl::after{content:"";width:44px;height:3px;background:var(--accent);border-radius:2px}
.ttl.light h3{color:#fff}
@media(max-width:640px){.vh p{margin-left:0}.vb{padding:16px 14px 20px}.ttl h3{font-size:22px}}
.hi{font-size:22px;line-height:1;color:var(--c,var(--accent))}

/* V0 current */
.cur{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cur .ib{display:flex;align-items:center;gap:12px;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;min-height:86px}
.cur .ib i{font-size:26px;color:#6b7280}
@media(max-width:760px){.cur{grid-template-columns:1fr 1fr}}

/* W1 themed columns */
.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.th{border-radius:16px;padding:16px;background:var(--s);border:1px solid rgba(0,0,0,.04)}
.th h5{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--c)}
.th h5 i{font-size:20px}
.th p{margin:0 0 12px;font-size:12px;color:var(--muted)}
.th .it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#fff;margin-bottom:7px;font-size:13px;font-weight:600;transition:transform .2s var(--ease)}
.th .it:hover{transform:translateX(4px)}
.th .it i{font-size:18px;color:var(--c)}
@media(max-width:760px){.thm{grid-template-columns:1fr}}

/* W2 polaroids */
.pols{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;padding:10px 0}
.pol{width:150px;background:#fff;padding:9px 9px 12px;box-shadow:0 10px 18px -10px rgba(0,0,0,.35);transform:rotate(var(--r));transition:transform .3s var(--ease);border:1px solid #eee}
.pol:hover{transform:rotate(0) scale(1.06);z-index:2}
.pol .ph{height:118px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c),#fff 55%));display:flex;align-items:center;justify-content:center;color:#fff;font-size:46px}
.pol .cap{font-family:"Caveat",cursive;font-size:20px;text-align:center;margin-top:7px;line-height:1.05}

/* W3 bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:110px;gap:12px}
.bt{border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:var(--s);position:relative;overflow:hidden;transition:transform .25s var(--ease)}
.bt:hover{transform:translateY(-3px)}
.bt i.bg{position:absolute;right:-10px;bottom:-18px;font-size:110px;opacity:.12;color:var(--c)}
.bt i.fg{font-size:24px;color:var(--c)}
.bt b{font-size:14px;position:relative}.bt small{font-size:11.5px;color:var(--muted);position:relative}
.bt.big{grid-column:span 2;grid-row:span 2}.bt.big b{font-size:22px}.bt.big i.fg{font-size:34px}
.bt.wide{grid-column:span 2}
@media(max-width:760px){.bento{grid-template-columns:1fr 1fr}.bt.big{grid-row:span 1}}

/* W4 pill cloud */
.pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.pl{display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--c);font-size:13.5px;font-weight:600;transition:.25s var(--ease)}
.pl i{font-size:18px;color:var(--c)}
.pl:hover{background:var(--c);color:#fff}.pl:hover i{color:#fff}
.lead{text-align:center;font-size:14px;color:var(--muted);margin:0 0 16px}
.lead b{color:var(--text)}

/* W5 weekend */
.wk{display:grid;grid-template-columns:110px 1fr 1fr;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.wk>div{padding:10px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.wk>div:nth-child(3n){border-right:0}
.wk .hd{background:var(--surface);font-weight:700;font-size:13px}
.wk .tm{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:#fbfcfb}
.wk .ev{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;border-left:4px solid var(--c)!important;background:var(--s)}
.wk .ev i{color:var(--c);font-size:18px}
.wk>div:nth-last-child(-n+3){border-bottom:0}

/* W6 venn */
.venn{position:relative;width:min(560px,100%);aspect-ratio:1.18;margin:0 auto}
.vc{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;mix-blend-mode:multiply}
.vc.a{left:3%;top:0;background:rgba(59,130,246,.2);border:2px solid rgba(59,130,246,.5)}
.vc.b{right:3%;top:0;background:rgba(24,210,110,.22);border:2px solid rgba(15,157,79,.5)}
.vc.c{left:22%;bottom:0;background:rgba(236,72,153,.18);border:2px solid rgba(236,72,153,.45)}
.vl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.vl h6{margin:0 0 3px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.vl span{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:99px}
.vl .ctr{background:var(--text);color:#fff}

/* W7 now playing */
.np{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.player{border-radius:18px;background:linear-gradient(160deg,#0f5e37,#121212 75%);color:#fff;padding:18px;display:flex;gap:16px;align-items:center}
.disc{width:120px;height:120px;flex:none;border-radius:50%;background:repeating-radial-gradient(#111 0 2px,#222 2px 4px);display:flex;align-items:center;justify-content:center;animation:spin 6s linear infinite;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.disc::after{content:"";width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#111 0 4px,var(--fill) 5px)}
@keyframes spin{to{transform:rotate(360deg)}}
.player small{font-size:10.5px;letter-spacing:.14em;color:#9be8c0}
.player b{display:block;font-size:20px;margin:4px 0}
.player p{margin:0;font-size:12px;opacity:.8}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px;margin-top:10px}
.eq i{width:4px;background:var(--fill);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:4px}50%{height:20px}}
.queue{border-radius:18px;background:var(--surface);padding:10px}
.queue .q{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600}
.queue .q:hover{background:#fff}
.queue .q i{font-size:18px;color:var(--c);width:22px;text-align:center}
.queue .q small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
@media(max-width:760px){.np{grid-template-columns:1fr}}

/* W8 orbit */
.orb{position:relative;width:min(420px,90vw);aspect-ratio:1;margin:0 auto}
.orb .ring{position:absolute;inset:6%;border-radius:50%;border:1.5px dashed rgba(15,157,79,.35)}
.orb .core{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2be38a,var(--accent));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;box-shadow:0 20px 40px -14px rgba(15,157,79,.6)}
.orb .core small{font-size:10.5px;font-weight:500;opacity:.9}
.orb .spin{position:absolute;inset:0;animation:spin 50s linear infinite}
.orb:hover .spin,.orb:hover .sat i{animation-play-state:paused}
.orb .sat{position:absolute;width:58px;height:58px;margin:-29px;border-radius:16px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -10px rgba(0,0,0,.4)}
.orb .sat i{font-size:26px;color:var(--c);animation:spin 50s linear infinite reverse}
.orbcap{text-align:center;font-size:12.5px;color:var(--muted);min-height:20px;margin-top:6px}
.orbcap b{color:var(--accent-text)}

/* W9 editorial list */
.ed{border-top:2px solid var(--text)}
.er{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--border);transition:padding .3s var(--ease),background .3s}
.er i{font-size:24px;color:var(--c);transition:transform .3s var(--ease)}
.er b{font-size:clamp(18px,3vw,28px);letter-spacing:-.01em}
.er span{font-size:12px;color:var(--muted);text-align:right}
.er:hover{padding-left:14px;background:linear-gradient(90deg,var(--s),transparent)}
.er:hover i{transform:rotate(-12deg) scale(1.2)}
@media(max-width:600px){.er{grid-template-columns:34px 1fr}.er span{display:none}}

/* W10 flip */
.flips{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.flip{perspective:900px;height:140px}
.flip .inr{position:relative;height:100%;transition:transform .7s var(--ease);transform-style:preserve-3d}
.flip:hover .inr{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.flip .f{background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:700}
.flip .f i{font-size:32px;color:var(--c)}
.flip .b{background:var(--c);color:#fff;transform:rotateY(180deg);font-size:12.5px;line-height:1.4}
@media(max-width:760px){.flips{grid-template-columns:repeat(2,1fr)}}

/* W11 trail */
.trail{width:100%;height:auto}
.trail .path{fill:none;stroke:#c8b48a;stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round}
.trail .m{fill:#9cc9a8;opacity:.55}
.trail .cp circle{fill:#fff;stroke-width:3}
.trail text{font-family:var(--font);font-size:13px;font-weight:700;fill:var(--text)}
.trail .ii{font-family:remixicon;font-size:20px}

/* W12 bookshelf */
.shelf{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:20px 10px 0;border-bottom:14px solid #3a2f25;min-height:280px;overflow-x:auto}
.bk{flex:none;width:62px;border-radius:5px 5px 2px 2px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 12px;transition:transform .3s var(--ease);box-shadow:inset -6px 0 0 rgba(0,0,0,.12),inset 3px 0 0 rgba(255,255,255,.18);cursor:pointer}
.bk:hover{transform:translateY(-18px)}
.bk i{font-size:22px}
.bk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.shelfnote{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;min-height:18px}
.shelfnote b{color:var(--accent-text)}

/* W13 laptop stickers */
.lap{position:relative;width:min(640px,100%);aspect-ratio:1.6;margin:0 auto;border-radius:22px;background:linear-gradient(145deg,#cfd6d2,#aab3ae);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 20px 34px -20px rgba(0,0,0,.5)}
.lap::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#e8ece9,#bfc7c2);opacity:.8}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--c);color:#fff;font-weight:700;font-size:12px;border:3px solid #fff;box-shadow:0 6px 10px -4px rgba(0,0,0,.35);white-space:nowrap;transition:transform .25s var(--ease)}
.stk:hover{transform:translate(-50%,-50%) rotate(0) scale(1.1);z-index:2}
.stk i{font-size:16px}
.stk.sq{border-radius:12px}

/* W14 stories */
.stories{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;cursor:pointer}
.st .rg{width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(var(--fill),#3b82f6,#ec4899,var(--fill))}
.st .rg div{width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.st .rg i{font-size:28px;color:var(--c)}
.st small{font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.st.seen .rg{background:#d1d5db}
.storyview{margin-top:8px;border-radius:16px;background:linear-gradient(140deg,var(--c,#0f9d4f),#111);color:#fff;padding:18px;display:flex;align-items:center;gap:16px;min-height:120px;transition:background .4s}
.storyview i{font-size:58px}
.storyview b{font-size:22px;display:block}.storyview span{font-size:13px;opacity:.9}
.storyview .bar{position:absolute}

/* W15 tabs */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:5px;width:max-content;max-width:100%;margin:0 auto 16px;flex-wrap:wrap}
.tabs button{font-family:inherit;font-size:13px;font-weight:600;border:0;background:transparent;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
.tabs button.on i{color:var(--c)}
.tpane{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.tcard{display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--s);border:1px solid rgba(0,0,0,.04)}
.tcard i{font-size:30px;color:var(--c)}
.tcard b{display:block;font-size:14px}.tcard small{font-size:12px;color:var(--muted)}

/* W16 masonry */
.mas{columns:4 210px;column-gap:12px}
.mc{break-inside:avoid;margin-bottom:12px;border-radius:16px;padding:16px;background:linear-gradient(160deg,var(--s),#fff);border:1px solid rgba(0,0,0,.05);transition:transform .25s var(--ease)}
.mc:hover{transform:translateY(-3px)}
.mc i{font-size:28px;color:var(--c)}
.mc b{display:block;font-size:15px;margin:8px 0 4px}
.mc p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.mc.tall{padding:22px 16px 34px}
.mc .tg{display:inline-block;margin-top:10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}

/* W17 merit badges */
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.bd{width:128px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bd .em{width:104px;height:104px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--c),0 12px 18px -10px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px);transition:transform .35s var(--ease)}
.bd .em::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
.bd .em i{font-size:40px;color:#fff}
.bd:hover .em{transform:rotate(-10deg) scale(1.06)}
.bd b{font-size:12px;line-height:1.25}

/* W18 tickets */
.tix{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tk{display:grid;grid-template-columns:1fr 70px;border-radius:12px;overflow:hidden;background:var(--s);position:relative;transition:transform .25s var(--ease)}
.tk:hover{transform:rotate(-1deg) translateY(-2px)}
.tk .mn{padding:12px 14px}
.tk .mn small{font-size:10px;letter-spacing:.16em;color:var(--c);font-weight:700}
.tk .mn b{display:block;font-size:15px;margin:3px 0}
.tk .mn span{font-size:11.5px;color:var(--muted)}
.tk .stub{border-left:2px dashed rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--c);color:#fff;font-size:9px;letter-spacing:.14em;font-weight:700}
.tk .stub i{font-size:26px}
.tk::before,.tk::after{content:"";position:absolute;right:59px;width:20px;height:20px;border-radius:50%;background:#fff}
.tk::before{top:-10px}.tk::after{bottom:-10px}

/* W19 mood board */
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;background:#f7f3ec;padding:18px;border-radius:16px}
.mb{position:relative;background:#fff;padding:12px;box-shadow:0 8px 14px -10px rgba(0,0,0,.35);transform:rotate(var(--r));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mb::before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);opacity:.75}
.mb i{font-size:30px;color:var(--c)}
.mb b{font-family:"Caveat",cursive;font-size:21px;line-height:1}
.mb small{font-size:10.5px;color:var(--muted)}
@media(max-width:760px){.mood{grid-template-columns:repeat(2,1fr)}}

/* W20 marquee */
.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);padding:6px 0}
.mq .tr{display:flex;gap:14px;width:max-content;animation:mq 34s linear infinite}
.mq.rev .tr{animation-direction:reverse}
.mq:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq .w{display:inline-flex;align-items:center;gap:10px;font-size:clamp(22px,3.6vw,38px);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mq .w i{font-size:.9em;color:var(--c)}
.mq .w.o{color:transparent;-webkit-text-stroke:1.2px var(--text)}
.mq .w.o i{-webkit-text-stroke:0}
.bio{text-align:center;font-size:13px;color:var(--muted);max-width:620px;margin:14px auto 0;line-height:1.6}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>Interests & Hobbies — <b>20</b> variant</h1>
  <a href="interests-variants-2.html" style="font-size:12px;color:var(--muted);white-space:nowrap">X1–X20 →</a>
  <nav class="jump" id="jump"></nav>
</div></div>
<div class="wrap">
  <p class="intro">Saytingizdagi <b>Interests and Hobbies</b> bo'limi uchun 20 ta dizayn — saytning ranglari, shrifti va panel uslubida. Eng tepada solishtirish uchun <b>hozirgi</b> ko'rinish. Qiziqishlar uch mavzuga ajratildi: <b style="color:var(--mind)">Mind</b> (fikr), <b style="color:var(--body)">Body</b> (harakat), <b style="color:var(--art)">Creative</b> (ijod).</p>
  <div id="variants"></div>
</div>
<div style="display:none" id="hid"></div>

<script>
const H=[
 {k:"foot",n:"Football",ic:"ri-football-line",g:"body",d:"Playing and watching the game"},
 {k:"hike",n:"Hiking",ic:"ri-walk-line",g:"body",d:"Mountain trails and fresh air"},
 {k:"out",n:"Outdoor Activities",ic:"ri-compass-3-line",g:"body",d:"Adventures under the open sky"},
 {k:"read",n:"Reading (Self-help books)",s:"Reading",ic:"ri-book-open-line",g:"mind",d:"Books on growth and habits"},
 {k:"econ",n:"Economic and Political research",s:"Economics & Politics",ic:"ri-line-chart-line",g:"mind",d:"How the world really works"},
 {k:"hist",n:"Historical research and reading",s:"History",ic:"ri-ancient-gate-line",g:"mind",d:"Empires, people and ideas"},
 {k:"ai",n:"Artificial Intelligence",s:"AI",ic:"ri-robot-2-line",g:"mind",d:"Exploring what AI can do next"},
 {k:"design",n:"Graphic and Motion design",s:"Motion design",ic:"ri-palette-line",g:"art",d:"Visual stories and animation"},
 {k:"sing",n:"Singing",ic:"ri-mic-line",g:"art",d:"Rock ballads and good vibes"},
 {k:"music",n:"Playing an instrument (guitar, piano)",s:"Guitar & Piano",ic:"ri-music-2-line",g:"art",d:"Guitar since childhood — rock fan"}
];
const T={mind:{n:"Mind",c:"#3b82f6",s:"#eaf2ff",ic:"ri-brain-line",d:"Curiosity, reading and research"},body:{n:"Body",c:"#0f9d4f",s:"#e7f8ee",ic:"ri-walk-line",d:"Movement, sport and nature"},art:{n:"Creative",c:"#ec4899",s:"#fdeef6",ic:"ri-palette-line",d:"Music, voice and visual design"}};
const TK=["mind","body","art"];
const by=g=>H.filter(h=>h.g===g);
const sn=h=>h.s||h.n;
const cv=h=>`--c:${T[h.g].c};--s:${T[h.g].s}`;
const title=(t,c="")=>`<div class="ttl ${c}"><h3>${t}</h3></div>`;
const TT="Interests";

const V=[
 {id:"H0",t:"Hozirgi ko'rinish",tag:"solishtirish uchun",d:"Saytda hozir turgan variant: kulrang ikonkali bir xil kartalar.",
  h:()=>title("Interests and hobbies")+`<div class="cur">${H.map(h=>`<div class="ib"><i class="${h.ic}"></i>${h.n}</div>`).join("")}</div>`},

 {id:"W1",t:"Mavzular bo'yicha ustunlar",tag:"tartibli · ixcham",d:"Qiziqishlar uch ustunga ajratilgan: Mind, Body, Creative. Har bir ustunning o'z rangi va qisqa tavsifi bor — siz qanday odam ekaningiz bir qarashda ko'rinadi.",
  h:()=>title(TT)+`<div class="thm">${TK.map(t=>`<div class="th" style="--c:${T[t].c};--s:${T[t].s}"><h5><i class="${T[t].ic}"></i>${T[t].n}</h5><p>${T[t].d}</p>${by(t).map(h=>`<div class="it"><i class="${h.ic}"></i>${sn(h)}</div>`).join("")}</div>`).join("")}</div>`},

 {id:"W2",t:"Polaroid suratlar",tag:"iliq · shaxsiy",d:"Har bir hobbi — qiyshiq yopishtirilgan polaroid surat, ostida qo'lyozma imzo. Keyinchalik rangli fon o'rniga o'zingizning haqiqiy suratlaringizni qo'yish mumkin.",
  h:()=>title(TT)+`<div class="pols">${H.map((h,i)=>`<div class="pol" style="--c:${T[h.g].c};--r:${[-4,3,-2,5,-3,2,-5,4,-1,3][i]}deg"><div class="ph"><i class="${h.ic}"></i></div><div class="cap">${sn(h)}</div></div>`).join("")}</div>`},

 {id:"W3",t:"Bento grid",tag:"zamonaviy · urg'u",d:"Asosiy ishtiyoqlar — Guitar & Piano va Hiking — katta plitkalarda, qolganlari kichik. Orqa fonda katta xira ikonka. Nima eng muhimligini darhol ko'rsatadi.",
  h:()=>{const order=["music","hike","foot","read","ai","design","econ","hist","sing","out"],cls={music:"big",hike:"big",econ:"wide",hist:"wide",sing:"wide",out:"wide"};
   return title(TT)+`<div class="bento">${order.map(k=>{const h=H.find(x=>x.k===k);return `<div class="bt ${cls[k]||""}" style="${cv(h)}"><i class="${h.ic} bg"></i><i class="${h.ic} fg"></i><div><b>${sn(h)}</b>${cls[k]==="big"?`<br><small>${h.d}</small>`:""}</div></div>`}).join("")}</div>`}},

 {id:"W4",t:"Ixcham kapsulalar",tag:"minimal · tejamkor",d:"Eng ixcham variant: bitta jumla va rangli kapsulalar. Bo'lim joyni deyarli egallamaydi, lekin baribir shaxsiy.",
  h:()=>title(TT)+`<p class="lead">When I'm offline I'm <b>moving</b>, <b>reading</b> or <b>making something</b>.</p><div class="pills">${H.map(h=>`<span class="pl" style="${cv(h)}"><i class="${h.ic}"></i>${sn(h)}</span>`).join("")}</div>`},

 {id:"W5",t:"Dam olish kunlari rejasi",tag:"hikoya · hayotiy",d:"Shanba va yakshanba jadvali: ertalab, kunduzi, kechqurun — qaysi hobbi qachon. Odamni “jonli” ko'rsatadi. Soatlar yo'q, faqat kun qismlari.",
  h:()=>{const R=[["Morning","ri-sun-line","hike","read"],["Afternoon","ri-sun-foggy-line","foot","econ"],["Evening","ri-moon-line","music","design"],["Late","ri-moon-clear-line","sing","hist"]];const f=k=>H.find(x=>x.k===k);
   return title(TT)+`<div class="wk"><div class="hd"></div><div class="hd">Saturday</div><div class="hd">Sunday</div>${R.map(([t,ic,a,b])=>`<div class="tm"><i class="${ic}"></i>${t}</div><div class="ev" style="${cv(f(a))}"><i class="${f(a).ic}"></i>${sn(f(a))}</div><div class="ev" style="${cv(f(b))}"><i class="${f(b).ic}"></i>${sn(f(b))}</div>`).join("")}</div>
   <div class="pills" style="margin-top:12px">${["out","ai"].map(k=>{const h=f(k);return `<span class="pl" style="${cv(h)}"><i class="${h.ic}"></i>${sn(h)} — anytime</span>`}).join("")}</div>`}},

 {id:"W6",t:"Venn diagrammasi",tag:"aqlli · balans",d:"Uch doira — Mind, Body, Creative. Kesishmalarda ikki dunyoni birlashtiradigan qiziqishlar (masalan, AI — fikr va ijod orasida). Markazda — siz.",
  h:()=>{const s=k=>{const h=H.find(x=>x.k===k);return `<span><i class="${h.ic}" style="color:${T[h.g].c}"></i>${sn(h)}</span>`};
   return title(TT)+`<div class="venn"><div class="vc a"></div><div class="vc b"></div><div class="vc c"></div>
   <div class="vl" style="left:22%;top:30%"><h6 style="color:var(--mind)">Mind</h6>${s("read")}${s("econ")}${s("hist")}</div>
   <div class="vl" style="left:78%;top:30%"><h6 style="color:var(--body)">Body</h6>${s("foot")}${s("hike")}</div>
   <div class="vl" style="left:50%;top:86%"><h6 style="color:var(--art)">Creative</h6>${s("sing")}${s("music")}</div>
   <div class="vl" style="left:50%;top:16%">${s("out")}</div><div class="vl" style="left:31%;top:63%">${s("ai")}${s("design")}</div>
   <div class="vl" style="left:50%;top:46%"><span class="ctr">JM</span></div></div>`}},

 {id:"W7",t:"Hozir yangrayapti",tag:"musiqiy · signature",d:"Musiqa — markazda: aylanuvchi plastinka va “Now playing: Guitar & Piano”. Qolgan qiziqishlar — navbatdagi treklar ro'yxati. Rok sevgingizga to'g'ridan-to'g'ri ishora.",
  h:()=>title(TT)+`<div class="np"><div class="player"><div class="disc"></div><div><small>NOW PLAYING</small><b>Guitar & Piano</b><p>Since childhood · rock on repeat · singing along</p><div class="eq"><i></i><i></i><i></i><i></i></div></div></div>
   <div class="queue">${H.filter(h=>h.k!=="music").map(h=>`<div class="q" style="${cv(h)}"><i class="${h.ic}"></i>${sn(h)}<small>${T[h.g].n}</small></div>`).join("")}</div></div>`},

 {id:"W8",t:"Orbita",tag:"kreativ · harakat",d:"Markazda “JM offline”, atrofida qiziqishlar sekin aylanadi. Ikonkaga borilsa aylanish to'xtaydi va nomi chiqadi.",
  h:()=>title(TT)+`<div class="orb" id="orb"><div class="ring"></div><div class="spin">${H.map((h,i)=>{const a=i/H.length*2*Math.PI-Math.PI/2;return `<div class="sat" data-n="${sn(h)}" data-d="${h.d}" style="--c:${T[h.g].c};left:${(50+Math.cos(a)*44).toFixed(2)}%;top:${(50+Math.sin(a)*44).toFixed(2)}%"><i class="${h.ic}"></i></div>`}).join("")}</div><div class="core">JM<small>offline mode</small></div></div><div class="orbcap" id="orbcap">ikonkaga sichqonchani olib boring</div>`},

 {id:"W9",t:"Jurnal ro'yxati",tag:"tipografik · premium",d:"Katta harfli ro'yxat, har qatorda ikonka va qisqa izoh. Qatorga borilganda u siljiydi va rangli fon chiqadi.",
  h:()=>title(TT)+`<div class="ed">${H.map(h=>`<div class="er" style="${cv(h)}"><i class="${h.ic}"></i><b>${sn(h)}</b><span>${h.d}</span></div>`).join("")}</div>`},

 {id:"W10",t:"Aylanuvchi kartalar",tag:"interaktiv · qiziqarli",d:"Old tomonda ikonka va nom, orqasida — nima uchun yoqishi haqida bir jumla. Sichqoncha bilan ustiga borilsa karta aylanadi.",
  h:()=>title(TT)+`<div class="flips">${H.map(h=>`<div class="flip" style="${cv(h)}"><div class="inr"><div class="f"><i class="${h.ic}"></i>${sn(h)}</div><div class="b">${h.d}</div></div></div>`).join("")}</div>`},

 {id:"W11",t:"Tog' so'qmoqi",tag:"sarguzasht · hikoya",d:"Piyoda sayohat metaforasi: tog'lar orasidan o'tuvchi so'qmoq, har bir qiziqish — yo'ldagi to'xtash nuqtasi.",
  h:()=>{const P=[[60,250],[160,200],[260,235],[360,170],[460,205],[560,140],[660,180],[760,110],[860,150],[950,80]];
   let s=`<svg class="trail" viewBox="0 0 1000 300"><path class="m" d="M0,300 L140,120 L260,300Z"/><path class="m" d="M200,300 L420,70 L620,300Z" style="opacity:.4"/><path class="m" d="M520,300 L760,40 L1000,300Z"/><path class="m" d="M820,300 L940,150 L1000,220 L1000,300Z" style="opacity:.4"/>
    <path class="path" d="M${P.map(p=>p.join(",")).join(" L")}"/>`;
   H.forEach((h,i)=>{const [x,y]=P[i];s+=`<g class="cp"><circle cx="${x}" cy="${y}" r="17" stroke="${T[h.g].c}"/><text x="${x}" y="${y+7}" text-anchor="middle" class="ii" fill="${T[h.g].c}">${glyph(h.ic)}</text><text x="${x}" y="${i%2?y+40:y-28}" text-anchor="middle" style="font-size:12px">${sn(h)}</text></g>`});
   s+=`<text x="975" y="40" text-anchor="end" style="font-size:11px;fill:#6b7280">⛰ summit: balance</text></svg>`;return title(TT)+s}},

 {id:"W12",t:"Kitob javoni",tag:"iliq · o'quvchi",d:"Har bir qiziqish — javondagi kitob, rangi mavzusiga qarab. Kitobga borilsa u ko'tariladi va pastda izoh chiqadi. Kitob o'qishni yaxshi ko'rishingizga mos.",
  h:()=>{const C={mind:["#3b82f6","#1d4ed8","#2563eb","#60a5fa"],body:["#0f9d4f","#15803d","#16a34a"],art:["#ec4899","#db2777","#be185d"]},cnt={mind:0,body:0,art:0};
   return title(TT)+`<div class="shelf">${H.map((h,i)=>`<div class="bk" data-n="${sn(h)}" data-d="${h.d}" style="height:${[250,220,240,270,230,255,215,245,225,260][i]}px;background:${C[h.g][cnt[h.g]++]}"><i class="${h.ic}"></i><span>${sn(h)}</span></div>`).join("")}</div><div class="shelfnote" id="shelfnote">📚 kitobga sichqonchani olib boring</div>`}},

 {id:"W13",t:"Noutbuk stikerlari",tag:"o'yinli · dasturchi",d:"Dasturchilar noutbukiga stiker yopishtiradi — qiziqishlar ham shunday: noutbuk qopqog'ida rangli stikerlar. Kulgili va o'ziga xos.",
  h:()=>{const pos=[[18,22],[48,16],[80,24],[24,52],[76,50],[16,82],[46,84],[80,80],[56,34],[38,66]];
   return title(TT)+`<div class="lap">${H.map((h,i)=>`<span class="stk ${i%3===1?"sq":""}" style="--c:${T[h.g].c};--r:${[-8,5,-4,9,-6,4,-10,7,-3,6][i]}deg;left:${pos[i][0]}%;top:${pos[i][1]}%"><i class="${h.ic}"></i>${sn(h)}</span>`).join("")}</div>`}},

 {id:"W14",t:"Stories",tag:"tanish · ijtimoiy",d:"Instagram stories uslubida: qiziqishlar halqali doiralarda. Bosilganda pastda o'sha qiziqish “story” sifatida ochiladi, ko'rilgani kulrang bo'ladi.",
  h:()=>title(TT)+`<div class="stories" id="stories">${H.map((h,i)=>`<div class="st" data-i="${i}" style="${cv(h)}"><div class="rg"><div><i class="${h.ic}"></i></div></div><small>${sn(h)}</small></div>`).join("")}</div><div class="storyview" id="sview"></div>`},

 {id:"W15",t:"Tablar",tag:"interaktiv · ixcham",d:"Uch tab — Mind, Body, Creative. Bir vaqtda faqat bitta mavzu ko'rinadi, kartalarda qisqa izoh bilan.",
  h:()=>title(TT)+`<div class="tabs" id="tabs">${TK.map((t,i)=>`<button data-t="${t}" class="${i?"":"on"}" style="--c:${T[t].c}"><i class="${T[t].ic}"></i>${T[t].n}</button>`).join("")}</div><div id="tpane"></div>`},

 {id:"W16",t:"Masonry kartalar",tag:"jurnalbop · ma'noli",d:"Har xil balandlikdagi kartalar, har birida ikonka, nom va kichik izoh. Pinterest uslubi — tabiiy va boy ko'rinadi.",
  h:()=>title(TT)+`<div class="mas">${H.map((h,i)=>`<div class="mc ${i%3===0?"tall":""}" style="${cv(h)}"><i class="${h.ic}"></i><b>${sn(h)}</b><p>${h.d}</p><span class="tg">${T[h.g].n}</span></div>`).join("")}</div>`},

 {id:"W17",t:"Skaut nishonlari",tag:"teksturali · esda qoladi",d:"Har bir qiziqish — skautlarning tikilgan “merit badge” nishoni: mato teksturasi va tikuv chizig'i. Ustiga borilsa buriladi.",
  h:()=>title(TT)+`<div class="badges">${H.map(h=>`<div class="bd" style="--c:${T[h.g].c}"><span class="em"><i class="${h.ic}"></i></span><b>${sn(h)}</b></div>`).join("")}</div>`},

 {id:"W18",t:"Chiptalar",tag:"kreativ · sarguzasht",d:"Har bir hobbi — chipta: konsert (qo'shiq), stadion (futbol), tog' so'qmog'i (hiking), kutubxona (kitob)... Yirtiladigan qismi bilan.",
  h:()=>{const L={foot:"STADIUM PASS",hike:"TRAIL PASS",out:"OPEN AIR",read:"LIBRARY CARD",econ:"RESEARCH PASS",hist:"MUSEUM TICKET",ai:"LAB ACCESS",design:"STUDIO PASS",sing:"STAGE PASS",music:"CONCERT TICKET"};
   return title(TT)+`<div class="tix">${H.map(h=>`<div class="tk" style="${cv(h)}"><div class="mn"><small>${L[h.k]}</small><b>${sn(h)}</b><span>${h.d}</span></div><div class="stub"><i class="${h.ic}"></i>ADMIT JM</div></div>`).join("")}</div>`}},

 {id:"W19",t:"Mood board",tag:"ijodiy · samimiy",d:"Ilhom doskasi: lenta bilan yopishtirilgan kartochkalar, qo'lyozma nomlar. Dizayn va motion dizaynga qiziqishingizni ko'rsatadi.",
  h:()=>{const tapes=["#fde68a","#bbf7d0","#bfdbfe","#fbcfe8"];return title(TT)+`<div class="mood">${H.map((h,i)=>`<div class="mb" style="--c:${T[h.g].c};--r:${[-3,2,-1,3,-2,1,-3,2,-2,3][i]}deg;--tape:${tapes[i%4]}"><i class="${h.ic}"></i><b>${sn(h)}</b><small>${h.d}</small></div>`).join("")}</div>`}},

 {id:"W20",t:"Harakatlanuvchi so'zlar",tag:"dinamik · jasur",d:"Ikki qatorda katta so'zlar qarama-qarshi tomonga suzadi — biri to'liq, biri kontur. Pastda qisqa bio. Joy kam, taassurot katta.",
  h:()=>{const a=H.slice(0,5).map(h=>`<span class="w" style="--c:${T[h.g].c}"><i class="${h.ic}"></i>${sn(h)}</span>`).join(""),b=H.slice(5).map(h=>`<span class="w o" style="--c:${T[h.g].c}"><i class="${h.ic}"></i>${sn(h)}</span>`).join("");
   return title(TT)+`<div class="mq"><div class="tr">${a}${a}</div></div><div class="mq rev"><div class="tr">${b}${b}</div></div><p class="bio">A devoted rock fan with a guitar since childhood — happiest on a mountain trail, on the football pitch, or deep in a history book.</p>`}}
];

/* remixicon glyph for SVG text (reads the computed ::before content) */
function glyph(cls){const hid=document.getElementById("hid");const i=document.createElement("i");i.className=cls;hid.appendChild(i);const c=getComputedStyle(i,"::before").content.replace(/"/g,"");i.remove();return c}

document.getElementById("jump").innerHTML=V.map(v=>`<a href="#${v.id}">${v.id==="H0"?"Hozirgi":v.id}</a>`).join("");
function render(){document.getElementById("variants").innerHTML=V.map(v=>`<section class="var" id="${v.id}"><div class="vh"><span class="n">${v.id==="H0"?"0":v.id}</span><h2>${v.t}</h2><span class="tag">${v.tag}</span><p>${v.d}</p></div><div class="vb">${v.h()}</div></section>`).join("");wire()}
const links=()=>[...document.querySelectorAll(".jump a")];
addEventListener("scroll",()=>{let cur="H0";V.forEach(v=>{const el=document.getElementById(v.id);if(el&&el.getBoundingClientRect().top<160)cur=v.id});links().forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur))},{passive:true});

function wire(){
 /* W8 */
 const oc=document.getElementById("orbcap");document.querySelectorAll("#orb .sat").forEach(s=>s.addEventListener("mouseenter",()=>oc.innerHTML=`<b>${s.dataset.n}</b> — ${s.dataset.d}`));
 /* W12 */
 const snote=document.getElementById("shelfnote");document.querySelectorAll(".bk").forEach(b=>b.addEventListener("mouseenter",()=>snote.innerHTML=`<b>${b.dataset.n}</b> — ${b.dataset.d}`));
 /* W14 */
 const sv=document.getElementById("sview");const show=i=>{const h=H[i];document.querySelectorAll("#stories .st")[i].classList.add("seen");sv.style.setProperty("--c",T[h.g].c);sv.innerHTML=`<i class="${h.ic}"></i><div><b>${sn(h)}</b><span>${h.d} · ${T[h.g].n}</span></div>`};
 document.querySelectorAll("#stories .st").forEach(s=>s.addEventListener("click",()=>show(+s.dataset.i)));show(9);
 /* W15 */
 const tp=document.getElementById("tpane");const tab=t=>{document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));tp.innerHTML=`<div class="tpane">${by(t).map(h=>`<div class="tcard" style="${cv(h)}"><i class="${h.ic}"></i><div><b>${sn(h)}</b><small>${h.d}</small></div></div>`).join("")}</div>`};
 document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.dataset.t)));tab("mind");
}
/* wait for the icon font so SVG glyphs resolve */
(document.fonts?document.fonts.load('20px remixicon'):Promise.resolve()).then(render,render);
</script>
</body>
</html>
