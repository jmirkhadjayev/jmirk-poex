<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Interests & Hobbies — yana 20 ta variant</title>
<link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BB-02FF}
:root{
  --bg:#e7eeea;--panel:#fff;--surface:#f3f6f8;--surface2:#e9eef1;--border:rgba(15,23,30,.12);
  --text:#15181d;--muted:#454b54;--accent:#0f9d4f;--accent-text:#0a7d3f;--fill:#18d26e;--soft:rgba(24,210,110,.14);
  --mind:#3b82f6;--body:#0f9d4f;--art:#ec4899;
  --ease:cubic-bezier(.22,1,.36,1);--font:"M PLUS 1 Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  background-image:linear-gradient(rgba(15,157,79,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,157,79,.06) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;margin:0;white-space:nowrap}.top h1 b{color:var(--accent)}
.top .prev{font-size:12px;color:var(--muted);white-space:nowrap}
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:99px;border:1px solid var(--border);background:var(--panel)}
.jump a:hover,.jump a.on{background:var(--text);color:#fff;border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.intro{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px;max-width:900px}.intro b{color:var(--text)}
.var{background:var(--panel);border-radius:20px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 18px 40px -30px rgba(15,23,30,.45);scroll-margin-top:70px}
.var::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--fill),#9be8c0 60%,transparent);z-index:3}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px 12px;border-bottom:1px dashed var(--border);background:#fbfcfb}
.vh .n{min-width:34px;height:28px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--accent-text);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.vh h2{font-size:16px;margin:0}
.vh .tag{font-size:10.5px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:3px 9px;border-radius:99px}
.vh p{width:100%;margin:0 0 0 44px;font-size:12px;color:var(--muted);line-height:1.5}
.vb{padding:20px 22px 24px;position:relative}
.ttl{display:flex;align-items:center;gap:12px;margin:0 0 16px;position:relative;z-index:2}
.ttl h3{font-size:26px;font-weight:700;margin:0;text-transform:uppercase}
.ttl::after{content:"";width:44px;height:3px;background:var(--accent);border-radius:2px}
.ttl.light h3{color:#fff}
@media(max-width:640px){.vh p{margin-left:0}.vb{padding:16px 14px 20px}.ttl h3{font-size:22px}}

/* X1 post-its */
.notes{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;padding:8px 0}
.pi{width:150px;min-height:136px;padding:14px 12px 12px;background:var(--y);box-shadow:0 12px 16px -12px rgba(0,0,0,.4);transform:rotate(var(--r));font-family:"Caveat",cursive;position:relative;transition:transform .25s var(--ease)}
.pi::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a6b,#b91c1c);transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pi:hover{transform:rotate(0) scale(1.05);z-index:2}
.pi i{font-size:26px;color:rgba(0,0,0,.55)}
.pi b{display:block;font-size:24px;line-height:1;margin:6px 0 4px;color:#1f2937}
.pi span{font-size:18px;line-height:1.1;color:#374151}

/* X2 wrapped */
.wr{position:relative;height:340px;border-radius:20px;overflow:hidden;cursor:pointer;color:#fff;user-select:none}
.wr .bars{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:5px;z-index:3}
.wr .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.wr .bars i b{display:block;height:100%;width:0;background:#fff}
.wr .bars i.done b{width:100%}
.wr .bars i.cur b{animation:fillb 3.4s linear forwards}
@keyframes fillb{to{width:100%}}
.wr .sl{position:absolute;inset:0;padding:40px 30px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;opacity:0;transition:opacity .5s;background:var(--bgc)}
.wr .sl.on{opacity:1}
.wr .sl small{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.wr .sl h4{font-size:clamp(28px,5vw,48px);margin:0;line-height:1.02;letter-spacing:-.02em}
.wr .sl p{margin:0;font-size:14px;opacity:.9;max-width:460px}
.wr .sl i.big{position:absolute;right:30px;bottom:20px;font-size:150px;opacity:.25}
.wr .hint{position:absolute;right:16px;bottom:12px;font-size:11px;opacity:.8;z-index:3}

/* X3 postcards */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pc{position:relative;height:150px;border-radius:6px;overflow:hidden;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c),#fff 45%));color:#fff;padding:14px;box-shadow:0 12px 18px -14px rgba(0,0,0,.45);transition:transform .25s var(--ease)}
.pc:hover{transform:rotate(-1.5deg) translateY(-3px)}
.pc small{font-family:"Caveat",cursive;font-size:20px;opacity:.95}
.pc b{display:block;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-shadow:2px 2px 0 rgba(0,0,0,.15)}
.pc .stamp{position:absolute;right:10px;top:10px;width:46px;height:54px;background:#fff;padding:3px;-webkit-mask:radial-gradient(circle 3px at 3px 3px,#0000 96%,#000) -3px -3px/8px 8px round,linear-gradient(#000 0 0) 3px 3px/calc(100% - 6px) calc(100% - 6px) no-repeat;mask:radial-gradient(circle 3px at 3px 3px,#0000 96%,#000) -3px -3px/8px 8px round,linear-gradient(#000 0 0) 3px 3px/calc(100% - 6px) calc(100% - 6px) no-repeat}
.pc .stamp div{height:100%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.pc .pm{position:absolute;right:40px;top:40px;width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.6);font-size:8px;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.08em;transform:rotate(-14deg)}
.pc .msg{position:absolute;left:14px;bottom:12px;right:14px;font-family:"Caveat",cursive;font-size:18px;line-height:1.05}

/* X4 activity rings */
.rings{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.rings svg{width:min(300px,70vw);height:auto;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-width:24;stroke-linecap:round}
.rings .bg{opacity:.15}
.rings .fg{stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1.6s var(--ease),opacity .3s}
.in .rings .fg{stroke-dashoffset:0}
.rings.hl .fg:not(.on){opacity:.18}
.rl{display:flex;flex-direction:column;gap:12px}
.rg{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;transition:background .2s;cursor:default}
.rg:hover{background:var(--surface)}
.rg .dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c),#fff 75%)}
.rg b{font-size:15px;color:var(--c)}.rg div{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.rg div i{color:var(--c);margin-right:3px}
@media(max-width:760px){.rings{grid-template-columns:1fr;justify-items:center}}

/* X5 retro TV */
.tvw{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.tv{width:min(420px,88vw);background:linear-gradient(#8b5a2b,#6b4423);border-radius:26px;padding:18px;display:grid;grid-template-columns:1fr 70px;gap:14px;box-shadow:0 20px 34px -18px rgba(0,0,0,.55)}
.scr{position:relative;aspect-ratio:4/3;border-radius:22px;background:#111;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.scr .ch{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;background:radial-gradient(circle,var(--c),#0a0a0a 85%);padding:10px}
.scr .ch i{font-size:58px}.scr .ch b{font-size:18px}.scr .ch small{font-size:11.5px;opacity:.85}
.scr .noise{position:absolute;inset:-50%;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 3px),repeating-radial-gradient(circle at 63% 71%,#999 0 1px,transparent 1px 2px);opacity:0;animation:nz .2s steps(4) infinite;pointer-events:none}
.scr.zap .noise{opacity:.75}
@keyframes nz{25%{transform:translate(4%,-3%)}50%{transform:translate(-3%,5%)}75%{transform:translate(5%,2%)}}
.scr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 3px);pointer-events:none}
.ctl{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
.knob{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e5e7eb,#6b7280);border:3px solid #3f2a14;cursor:pointer;position:relative;transition:transform .3s var(--ease)}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:4px;height:14px;background:#3f2a14;transform:translateX(-50%);border-radius:2px}
.grill{width:46px;height:60px;background:repeating-linear-gradient(#3f2a14 0 3px,transparent 3px 6px);border-radius:6px}
.chlist{display:flex;flex-wrap:wrap;gap:6px}
.chlist button{font-family:inherit;font-size:12px;font-weight:600;padding:7px 11px;border-radius:99px;border:1px solid var(--border);background:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chlist button.on{background:var(--text);color:#fff}
.tvw .side h4{margin:0 0 6px;font-size:22px}.tvw .side p{margin:0 0 12px;color:var(--muted);font-size:13px}
@media(max-width:820px){.tvw{grid-template-columns:1fr;justify-items:center}}

/* X6 cassettes */
.tapes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tape{border-radius:12px;background:#222;padding:12px;color:#111;box-shadow:0 14px 22px -16px rgba(0,0,0,.6)}
.tape .lab{background:var(--lc);border-radius:6px;padding:8px 10px 10px;position:relative}
.tape .lab h5{margin:0 0 6px;font-family:"Caveat",cursive;font-size:24px;line-height:1;border-bottom:2px solid rgba(0,0,0,.25);padding-bottom:4px}
.tape .lab .tr{font-size:11.5px;font-weight:600;line-height:1.7}
.tape .lab .tr i{margin-right:4px}
.tape .win{margin:10px auto 0;width:70%;height:40px;border-radius:20px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border:2px solid #444}
.tape .reel{width:28px;height:28px;border-radius:50%;background:repeating-conic-gradient(#ddd 0 30deg,#999 30deg 60deg);border:4px solid #555}
.tape:hover .reel{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tape .side{color:#ddd;font-size:10px;letter-spacing:.2em;text-align:center;margin-top:6px}
@media(max-width:760px){.tapes{grid-template-columns:1fr}}

/* X7 tarot */
.tarot{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
@media(max-width:1000px){.tarot{grid-template-columns:repeat(5,1fr)}}
.tc .art i{font-size:30px!important}.tc b{font-size:10.5px!important}
.tc{aspect-ratio:.6;border-radius:12px;background:linear-gradient(170deg,#1e1b4b,#0f172a);padding:8px;color:#fde68a;box-shadow:0 14px 20px -14px rgba(0,0,0,.6);transition:transform .35s var(--ease),box-shadow .35s;cursor:default}
.tc:hover{transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 22px 30px -14px color-mix(in srgb,var(--c),#000 20%)}
.tc .fr{height:100%;border:1.5px solid #d4af37;border-radius:8px;outline:1px solid rgba(212,175,55,.45);outline-offset:-6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px;text-align:center;position:relative}
.tc .fr::before{content:"✦";font-size:11px;opacity:.8}
.tc .art{width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c),#fff 15%),transparent 70%);display:flex;align-items:center;justify-content:center}
.tc .art i{font-size:38px;color:#fff;filter:drop-shadow(0 0 8px var(--c))}
.tc b{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.08em}
.tc small{font-size:9.5px;color:#cbd5e1;letter-spacing:.06em}
@media(max-width:820px){.tarot{grid-template-columns:repeat(3,1fr)}}

/* X8 doodles */
.doo{background:#fffef8;border-radius:12px;padding:20px;background-image:radial-gradient(#d6e4f0 1px,transparent 1px);background-size:20px 20px;display:flex;flex-wrap:wrap;justify-content:center;gap:22px 26px;font-family:"Caveat",cursive}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px;width:120px;text-align:center}
.dd .cir{width:84px;height:84px;border:2.5px solid #1f2937;border-radius:52% 48% 55% 45%/48% 55% 45% 52%;display:flex;align-items:center;justify-content:center;transform:rotate(var(--r));transition:transform .3s var(--ease);background:color-mix(in srgb,var(--c),#fff 85%)}
.dd:hover .cir{transform:rotate(calc(var(--r) * -1)) scale(1.08)}
.dd .cir i{font-size:36px;color:#1f2937}
.dd b{font-size:22px;line-height:1;color:#1f2937}
.dd span{font-size:17px;color:var(--c);line-height:1}

/* X9 terminal */
.term{background:#0d1117;border-radius:14px;overflow:hidden;border:1px solid #1f2937}
.term .bar{display:flex;gap:7px;padding:10px 14px;background:#161b22;align-items:center}
.term .bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term .bar span{margin-left:auto;font-size:11.5px;color:#8b949e}
.term pre{margin:0;padding:16px 18px;font-family:var(--font);font-size:13.5px;line-height:1.75;color:#c9d1d9;white-space:pre-wrap}
.p{color:#3fb950}.d{color:#79c0ff;font-weight:700}.f{color:#e6edf3}.c{color:#8b949e}.s{color:#ffa657}
.term .ri{color:#7ee787;margin-right:4px}

/* X10 radio */
.radio{max-width:780px;margin:0 auto;border-radius:22px;background:linear-gradient(#e8dcc6,#d6c6a8);padding:18px;box-shadow:0 20px 34px -18px rgba(0,0,0,.45);border:3px solid #a68a5b}
.dial{position:relative;height:96px;border-radius:12px;background:linear-gradient(#1b1b1b,#2b2b2b);overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.8)}
.dial .scale{position:absolute;left:16px;right:16px;top:14px;height:20px;background:repeating-linear-gradient(90deg,#fbbf24 0 1px,transparent 1px 12px);opacity:.6}
.dial .st{position:absolute;top:44px;transform:translateX(-50%);font-size:10.5px;color:#fde68a;white-space:nowrap;font-weight:600;transition:color .2s,text-shadow .2s}
.dial .st.on{color:#fff;text-shadow:0 0 8px #fbbf24}
.dial .needle{position:absolute;top:6px;bottom:6px;width:3px;background:#ef4444;box-shadow:0 0 8px #ef4444;transform:translateX(-50%);transition:left .1s}
.radio input{width:100%;margin:14px 0 6px;accent-color:#7c5a2a}
.rdis{display:flex;align-items:center;gap:14px;background:#14261c;color:#7ef0b0;border-radius:10px;padding:10px 14px;font-family:"VT323",monospace;font-size:24px;min-height:56px}
.rdis i{font-size:28px}
.rdis small{font-size:18px;opacity:.75;margin-left:auto}

/* X11 vending */
.vend{display:grid;grid-template-columns:1fr 200px;gap:14px;max-width:820px;margin:0 auto;background:#b91c1c;border-radius:18px;padding:14px;box-shadow:0 20px 34px -18px rgba(0,0,0,.55)}
.vglass{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(230,240,245,.7));border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.vglass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 48%,transparent 56%);pointer-events:none;border-radius:10px}
.vi{background:#fff;border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-bottom:4px solid #9ca3af;transition:transform .2s}
.vi:hover{transform:translateY(-3px)}
.vi .can{width:40px;height:52px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c),#000 20%),var(--c) 40%,color-mix(in srgb,var(--c),#fff 30%) 60%,var(--c));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.vi small{font-size:9.5px;font-weight:700;text-align:center;line-height:1.15}
.vi .code{font-size:9px;background:#111;color:#fde68a;padding:1px 6px;border-radius:3px;letter-spacing:.1em}
.vpanel{background:#1f2937;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;color:#fff}
.vpanel .lcd{background:#14261c;color:#7ef0b0;font-family:"VT323",monospace;font-size:20px;border-radius:6px;padding:8px;min-height:64px;line-height:1.1}
.vpanel .tray{margin-top:auto;height:90px;border-radius:8px;background:#0b0f14;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.vpanel .tray .drop{animation:drop .6s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-120px)}}
@media(max-width:760px){.vend{grid-template-columns:1fr}.vglass{grid-template-columns:repeat(3,1fr)}}

/* X12 map */
.map{position:relative;height:400px;border-radius:16px;overflow:hidden;background:#eef3ea}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.pin .hd{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 10px -4px rgba(0,0,0,.4);transition:transform .25s var(--ease)}
.pin .hd i{transform:rotate(45deg);color:#fff;font-size:19px}
.pin:hover .hd{transform:rotate(-45deg) scale(1.15)}
.pin .lb{margin-top:6px;font-size:11px;font-weight:700;background:#fff;padding:2px 8px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}
.map .legend{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 10px;font-size:11px;display:flex;gap:12px}
.map .legend span{display:inline-flex;align-items:center;gap:5px}.map .legend i{width:10px;height:10px;border-radius:50%}

/* X13 garland */
.gar{position:relative;background:linear-gradient(#0f1a14,#16261c);border-radius:16px;padding:16px 10px 20px;overflow:hidden}
.gar svg{width:100%;height:60px;display:block}
.bulbs{display:grid;grid-template-columns:repeat(10,1fr);margin-top:-30px}
.bl{display:flex;flex-direction:column;align-items:center;gap:6px}
.bl .bb{width:18px;height:26px;border-radius:50% 50% 45% 45%;background:var(--c);box-shadow:0 0 14px 4px color-mix(in srgb,var(--c),transparent 40%);animation:tw 2.4s ease-in-out infinite;position:relative}
.bl .bb::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:7px;background:#9ca3af;transform:translateX(-50%);border-radius:2px}
.bl:nth-child(odd) .bb{animation-delay:-1.2s}
@keyframes tw{50%{opacity:.55;box-shadow:0 0 6px 1px color-mix(in srgb,var(--c),transparent 60%)}}
.bl .tag{margin-top:10px;background:#f5ecd7;color:#1f2937;border-radius:4px;padding:6px 5px;font-size:10.5px;font-weight:700;text-align:center;line-height:1.2;width:92%;position:relative;transform:rotate(var(--r))}
.bl .tag::before{content:"";position:absolute;top:-12px;left:50%;width:1px;height:12px;background:#d1d5db}
.bl .tag i{display:block;font-size:18px;color:var(--c);margin-bottom:2px}
@media(max-width:820px){.bulbs{grid-template-columns:repeat(5,1fr);row-gap:20px}.gar svg{display:none}.bulbs{margin-top:0}}

/* X14 fridge */
.fridge{border-radius:18px;background:linear-gradient(110deg,#dfe5e8,#f6f8f9 40%,#dde3e6);padding:24px;box-shadow:inset 0 0 0 3px #c9d1d5,0 18px 30px -20px rgba(0,0,0,.4);position:relative}
.fridge::before{content:"";position:absolute;right:20px;top:30px;bottom:30px;width:14px;border-radius:7px;background:linear-gradient(90deg,#9aa4a9,#d6dcdf)}
.word{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.word span{font-size:34px;font-weight:700;font-family:Arial Black,Arial,sans-serif;color:var(--c);text-shadow:0 3px 0 color-mix(in srgb,var(--c),#000 30%),0 6px 8px rgba(0,0,0,.25);transform:rotate(var(--r))}
.mags{display:flex;flex-wrap:wrap;gap:12px;padding-right:40px}
.mg{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--c);color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 0 color-mix(in srgb,var(--c),#000 30%),0 10px 14px -6px rgba(0,0,0,.35);transform:rotate(var(--r));transition:transform .2s;cursor:grab}
.mg:hover{transform:rotate(0) translateY(-3px)}
.mg i{font-size:18px}

/* X15 dice */
.dice{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.cubes{display:flex;gap:18px;perspective:600px}
.cube{width:86px;height:86px;border-radius:18px;background:#fff;border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 0 color-mix(in srgb,var(--c),#000 25%),0 16px 20px -8px rgba(0,0,0,.35);transform-style:preserve-3d}
.cube i{font-size:34px;color:var(--c)}
.cube small{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--c)}
.cube.roll{animation:roll .8s var(--ease)}

.dres h4{margin:0 0 6px;font-size:22px}.dres p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.6}
.dres p b{color:var(--text)}
.dres button{font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;border:0;background:var(--text);color:#fff;cursor:pointer}
@media(max-width:820px){.dice{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* X16 holo cards */
.holo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:760px;margin:0 auto}
.hc{aspect-ratio:.68;border-radius:14px;padding:6px;background:linear-gradient(135deg,#f5d36b,#c9a227);position:relative;overflow:hidden;transition:transform .2s;transform:perspective(700px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg))}
.hc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,0,150,.35) 35%,rgba(0,255,200,.35) 50%,rgba(255,255,0,.35) 65%,transparent 80%);background-size:250% 250%;background-position:var(--px,50%) var(--py,50%);mix-blend-mode:color-dodge;opacity:.0;transition:opacity .3s;pointer-events:none}
.hc:hover::after{opacity:1}
.hc .in2{height:100%;border-radius:10px;background:linear-gradient(170deg,var(--c),color-mix(in srgb,var(--c),#000 40%));color:#fff;display:flex;flex-direction:column;padding:8px}
.hc .tp{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.06em}
.hc .art{flex:1;margin:6px 0;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4)}
.hc .art i{font-size:40px}
.hc b{font-size:12.5px}
.hc small{font-size:9.5px;opacity:.9;line-height:1.3;margin-top:3px}
@media(max-width:820px){.holo{grid-template-columns:repeat(2,1fr)}}

/* X17 weather */
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.wc{border-radius:20px;padding:14px 16px;color:#fff;background:var(--sky);position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 20px -14px rgba(0,0,0,.45)}
.wc .row{display:flex;justify-content:space-between;align-items:flex-start}
.wc small{font-size:11px;opacity:.9}
.wc b{font-size:17px;display:block}
.wc .wi{font-size:34px}
.wc .hi{font-size:22px;opacity:.95}
.wc .cond{font-size:12px;opacity:.95}

/* X18 metro */
.metro{width:100%;height:auto}
.metro .ln{fill:none;stroke-width:10;stroke-linecap:round}
.metro .stn{fill:#fff;stroke:#111;stroke-width:3}
.metro g.s{cursor:default}
.metro g.s:hover .stn{r:12}
.metro text{font-family:var(--font);font-size:12.5px;font-weight:700;fill:var(--text)}
.metro .ln-lab{font-size:11px;font-weight:700}
.metro .hub{fill:#111}

/* X19 gallery */
.gal{background:linear-gradient(#efe9df,#e2d9ca);border-radius:14px;padding:26px 18px 18px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:22px 20px;position:relative}
.fr{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr .frm{padding:10px;background:linear-gradient(135deg,#3b2a1a,#6b4b2e);box-shadow:0 14px 18px -10px rgba(0,0,0,.5);position:relative}
.fr .frm::before{content:"";position:absolute;left:50%;top:-26px;width:60px;height:26px;background:radial-gradient(ellipse at 50% 0,rgba(255,240,200,.7),transparent 70%);transform:translateX(-50%)}
.fr .mat{background:#fbf8f2;padding:12px}
.fr .art{width:var(--w);height:var(--h);background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c),#fde68a 45%));display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px}
.fr .plq{background:#fff;padding:5px 9px;font-size:10.5px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.12);max-width:170px;line-height:1.35}
.fr .plq b{display:block;font-size:11.5px}
.fr:hover .art{filter:saturate(1.3)}

/* X20 glass aura */
.aura{position:relative;border-radius:18px;overflow:hidden;padding:24px;background:#f5faf7}
.aura .bl{position:absolute;border-radius:50%;filter:blur(46px);opacity:.75;animation:dr 14s ease-in-out infinite alternate}
.aura .b1{width:320px;height:320px;background:#93c5fd;left:-60px;top:-80px}
.aura .b2{width:300px;height:300px;background:#86efac;right:-40px;top:20px;animation-delay:-5s}
.aura .b3{width:280px;height:280px;background:#f9a8d4;left:35%;bottom:-130px;animation-delay:-9s}
@keyframes dr{to{transform:translate(40px,30px) scale(1.1)}}
.ag{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gc{background:rgba(255,255,255,.45);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;transition:transform .3s var(--ease)}
.gc:hover{transform:translateY(-4px)}
.gc i{font-size:28px;color:var(--c)}
.gc b{display:block;font-size:13.5px}.gc small{font-size:11.5px;color:var(--muted)}
</style>

<div class="wrap">
  <p class="intro">Ikkinchi to'plam — birinchi 20 tadan boshqacha ko'rinishlar. Mavzular o'sha: <b style="color:var(--mind)">Mind</b>, <b style="color:var(--body)">Body</b>, <b style="color:var(--art)">Creative</b>. Variantlar X1–X20.</p>

<script>

 {k:"foot",n:"Football",ic:"ri-football-line",g:"body",d:"Playing and watching the game"},

 {k:"out",n:"Outdoor Activities",s:"Outdoors",ic:"ri-compass-3-line",g:"body",d:"Adventures under the open sky"},
 {k:"read",n:"Reading (Self-help books)",s:"Reading",ic:"ri-book-open-line",g:"mind",d:"Books on growth and habits"},
 {k:"econ",n:"Economic and Political research",s:"Economics & Politics",ic:"ri-line-chart-line",g:"mind",d:"How the world really works"},
 {k:"hist",n:"Historical research and reading",s:"History",ic:"ri-ancient-gate-line",g:"mind",d:"Empires, people and ideas"},
 {k:"ai",n:"Artificial Intelligence",s:"AI",ic:"ri-robot-2-line",g:"mind",d:"Exploring what AI can do next"},
 {k:"design",n:"Graphic and Motion design",s:"Motion design",ic:"ri-palette-line",g:"art",d:"Visual stories and animation"},
 {k:"sing",n:"Singing",ic:"ri-mic-line",g:"art",d:"Rock ballads and good vibes"},
 {k:"music",n:"Playing an instrument (guitar, piano)",s:"Guitar & Piano",ic:"ri-music-2-line",g:"art",d:"Guitar since childhood — rock fan"}
];

const by=g=>H.filter(h=>h.g===g), f=k=>H.find(h=>h.k===k), sn=h=>h.s||h.n, C=h=>T[h.g].c;
const title=(t,c="")=>`<div class="ttl ${c}"><h3>${t}</h3></div>`;
const TT="Interests";
function glyph(cls){const hid=document.getElementById("hid");const i=document.createElement("i");i.className=cls;hid.appendChild(i);const c=getComputedStyle(i,"::before").content.replace(/"/g,"");i.remove();return c}

const V=[
 {id:"X1",t:"Stikerli eslatmalar",tag:"iliq · qo'lyozma",d:"Devorga mixlangan rangli yopishqoq qog'ozchalar: qo'lyozma nom va kichik izoh. Har mavzu o'z rangida (sariq, yashil, pushti, ko'k).",
  h:()=>{const Y={mind:"#bfdbfe",body:"#bbf7d0",art:"#fbcfe8"};return title(TT)+`<div class="notes">${H.map((h,i)=>`<div class="pi" style="--y:${i%4===3?"#fde68a":Y[h.g]};--r:${[-3,2,-1,3,-2,1,-3,2,-2,3][i]}deg"><i class="${h.ic}"></i><b>${sn(h)}</b><span>${h.d}</span></div>`).join("")}</div>`}},

 {id:"X2",t:"“Wrapped” hikoya",tag:"zamonaviy · interaktiv",d:"Spotify Wrapped uslubidagi slaydlar: “Your top passion”, “Your favourite place”... avtomatik almashadi, bosilsa keyingisiga o'tadi. Tepada progress chiziqchalari.",
  h:()=>{const S=[["#0f9d4f,#064e3b","Your top passion","Guitar & Piano","Since childhood. Rock on repeat.","ri-music-2-line"],["#16a34a,#14532d","Your favourite place","The mountains","Hiking trails, fresh air and football on weekends.","ri-landscape-line"],["#2563eb,#1e3a8a","Most-read shelves","Self-help & History","Plus economics, politics — and everything AI.","ri-book-open-line"],["#db2777,#831843","Your creative side","Motion design & singing","Visual stories by day, rock ballads by night.","ri-palette-line"],["#111827,#065f46","Your offline vibe","Rock + Trails","Curious mind. Active body. Creative soul.","ri-heart-3-line"]];
   return title(TT)+`<div class="wr" id="wr"><div class="bars">${S.map(()=>`<i><b></b></i>`).join("")}</div>${S.map(([g,a,b,c,ic])=>`<div class="sl" style="--bgc:linear-gradient(140deg,${g})"><small>${a}</small><h4>${b}</h4><p>${c}</p><i class="${ic} big"></i></div>`).join("")}<span class="hint">bosing →</span></div>`}},

 {id:"X3",t:"Otkritkalar",tag:"sayohat · vintage",d:"Har bir hobbi — “Greetings from…” otkritkasi: katta sarlavha, burchakda marka va pochta muhri, pastda qo'lyozma xabar.",
  h:()=>{const G={foot:"the pitch",hike:"the mountains",out:"the open air",read:"the library",econ:"the newsroom",hist:"the past",ai:"the future",design:"the studio",sing:"the stage",music:"the rock club"};
   return title(TT)+`<div class="pcs">${H.map(h=>`<div class="pc" style="--c:${C(h)}"><small>Greetings from</small><b>${G[h.k]}</b><div class="stamp"><div><i class="${h.ic}"></i></div></div><div class="pm">TASHKENT<br>POST</div><div class="msg">${sn(h)} — ${h.d.toLowerCase()}</div></div>`).join("")}</div>`}},

 {id:"X4",t:"Faollik halqalari",tag:"sog'lom · balans",d:"Aqlli soatlardagi “Activity rings” kabi uch halqa — Mind, Body, Creative. Hammasi yopiq: muvozanatli hayot. Ro'yxatdagi mavzuga borilsa uning halqasi ajraladi.",
  h:()=>{const R=[["body",130],["mind",100],["art",70]];
   return title(TT)+`<div class="rings" id="rings"><svg viewBox="0 0 300 300">${R.map(([g,r])=>`<circle class="bg" cx="150" cy="150" r="${r}" stroke="${T[g].c}"/><circle class="fg" data-g="${g}" cx="150" cy="150" r="${r}" stroke="${T[g].c}"/>`).join("")}</svg>
   <div class="rl">${["body","mind","art"].map(g=>`<div class="rg" data-g="${g}" style="--c:${T[g].c}"><span class="dot" style="background:${T[g].c}"></span><div style="margin:0"><b>${T[g].n}</b><div>${by(g).map(h=>`<i class="${h.ic}"></i>${sn(h)}`).join(" · ")}</div></div></div>`).join("")}</div></div>`}},

 {id:"X5",t:"Retro televizor",tag:"nostalgik · interaktiv",d:"Eski yog'och televizor: har bir hobbi — alohida kanal. Kanal tugmasi yoki ruchkani bosing — ekranda shovqin, keyin keyingi “kanal”.",
  h:()=>title(TT)+`<div class="tvw"><div class="tv"><div class="scr" id="scr"><div class="ch" id="tvch"></div><div class="noise"></div></div><div class="ctl"><div class="knob" id="knob" title="Next channel"></div><div class="knob" style="width:38px;height:38px"></div><div class="grill"></div></div></div>

 {id:"X6",t:"Kassetalar",tag:"musiqiy · retro",d:"Uch audiokasseta — Mind, Body va Creative “mixtape”lari, yorlig'ida qo'lda yozilgan treklar (hobbilar). Ustiga borilsa g'altaklar aylanadi.",
  h:()=>{const L={mind:"#bfdbfe",body:"#bbf7d0",art:"#fbcfe8"};return title(TT)+`<div class="tapes">${TK.map(g=>`<div class="tape"><div class="lab" style="--lc:${L[g]}"><h5>${T[g].n} mixtape</h5><div class="tr">${by(g).map(h=>`<div><i class="${h.ic}"></i>${sn(h)}</div>`).join("")}</div></div><div class="win"><span class="reel"></span><span class="reel"></span></div><div class="side">SIDE A · JM</div></div>`).join("")}</div>`}},

 {id:"X7",t:"Taro kartalari",tag:"sirli · ijodiy",d:"Har bir hobbi — taro kartasi: “The Rocker”, “The Wanderer”, “The Historian”... Qorong'i fon, oltin ramka, porlayotgan belgi.",
  h:()=>{const N={foot:"The Striker",hike:"The Wanderer",out:"The Explorer",read:"The Reader",econ:"The Analyst",hist:"The Historian",ai:"The Futurist",design:"The Artist",sing:"The Singer",music:"The Rocker"};
   return title(TT)+`<div class="tarot">${H.map(h=>`<div class="tc" style="--c:${C(h)}"><div class="fr"><div class="art"><i class="${h.ic}"></i></div><div><b>${N[h.k]}</b><br><small>${sn(h)}</small></div></div></div>`).join("")}</div>`}},

 {id:"X8",t:"Qo'lda chizilgan rasmlar",tag:"samimiy · yengil",d:"Daftar sahifasidagi doodle'lar: qiyshiq aylanalar ichida ikonkalar, qo'lyozma nomlar. Juda insoniy va iliq.",
  h:()=>title(TT)+`<div class="doo">${H.map((h,i)=>`<div class="dd" style="--c:${C(h)}"><div class="cir" style="--r:${[-6,4,-3,7,-5,3,-7,5,-4,6][i]}deg"><i class="${h.ic}"></i></div><b>${sn(h)}</b><span>${T[h.g].n.toLowerCase()} ✎</span></div>`).join("")}</div>`},

 {id:"X9",t:"Terminal",tag:"dasturchi · hazil",d:"Hero'dagi terminal uslubida: `ls ~/hobbies` papkalarni ko'rsatadi, `cat` esa sevimli mashg'ulotni. Dasturchilar uchun kulgili.",
  h:()=>title(TT)+`<div class="term"><div class="bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span>jamshid@offline: ~ — zsh</span></div><pre><span class="p">➜</span> <span class="d">~</span> ls hobbies/
${TK.map(g=>`<span class="d">${T[g].n.toLowerCase()}/</span>`).join("   ")}

<span class="p">➜</span> <span class="d">~</span> ls hobbies/*
${TK.map(g=>`<span class="d">${T[g].n.toLowerCase()}/</span>  ${by(g).map(h=>`<span class="f">${sn(h).toLowerCase().replace(/ & /g,"-and-").replace(/ /g,"-")}</span>`).join("  ")}`).join("\n")}

<span class="p">➜</span> <span class="d">~</span> cat hobbies/creative/guitar-and-piano
<span class="s">"Guitar since childhood. Devoted rock fan. Volume: loud."</span>

<span class="p">➜</span> <span class="d">~</span> <span class="c"># status: recharging — back online on Monday</span></pre></div>`},

 {id:"X10",t:"Radio to'lqinlari",tag:"interaktiv · retro",d:"Eski radio: slayderni surib to'lqinlarni sozlang — ko'rsatkich qaysi “stansiya”ga tushsa, ekranda o'sha hobbi chiqadi. Chastota raqamlari yo'q, faqat stansiya nomlari.",
  h:()=>title(TT)+`<div class="radio"><div class="dial" id="dial"><div class="scale"></div>${H.map((h,i)=>`<span class="st" data-i="${i}" style="left:${6+i*9.8}%">${sn(h).split(" ")[0]}</span>`).join("")}<div class="needle" id="needle"></div></div><input type="range" id="tune" min="0" max="1000" value="910"><div class="rdis" id="rdis"></div></div>`},

 {id:"X11",t:"Savdo avtomati",tag:"o'yin · kulgili",d:"Ichimlik avtomati: har bir “banka” — hobbi. Bosilgan banka pastki lotokka tushadi va ekranda “Enjoy: …” chiqadi.",

 {id:"X12",t:"“Meni qayerda topasiz”",tag:"xarita · shaxsiy",d:"Stilizatsiya qilingan shahar xaritasi: tog'lar, stadion, kutubxona, studiya... har birida hobbi pini. Haqiqiy manzillar yo'q — faqat obraz.",
  h:()=>{const P=[["hike",82,26,"Mountains"],["out",64,40,"Park"],["foot",30,58,"Stadium"],["read",48,70,"Library"],["hist",18,28,"Museum"],["econ",40,32,"Newsstand"],["ai",62,74,"Lab"],["design",78,62,"Studio"],["sing",90,82,"Stage"],["music",12,82,"Home"]];
   return title(TT)+`<div class="map"><svg viewBox="0 0 1000 400" preserveAspectRatio="none"><path d="M0,260 C200,240 300,300 520,270 S820,230 1000,280 L1000,300 C820,250 640,300 520,290 S200,260 0,280Z" fill="#bfdbfe"/>

   <div class="legend">${TK.map(g=>`<span><i style="background:${T[g].c}"></i>${T[g].n}</span>`).join("")}</div></div>`}},

 {id:"X13",t:"Gulchambar chiroqlar",tag:"bayramona · iliq",d:"Qorong'ida osilgan rangli lampochkalar, har biridan hobbi yorlig'i osilib turadi. Lampalar navbatma-navbat miltillaydi.",
  h:()=>`<div class="gar">${title(TT,"light")}<svg viewBox="0 0 1000 60" preserveAspectRatio="none"><path d="M0,10 Q50,50 100,30 T200,30 T300,30 T400,30 T500,30 T600,30 T700,30 T800,30 T900,30 T1000,10" stroke="#4b5563" stroke-width="2" fill="none"/></svg>
   <div class="bulbs">${H.map((h,i)=>`<div class="bl" style="--c:${["#fde047","#4ade80","#60a5fa","#f472b6"][i%4]}"><span class="bb"></span><span class="tag" style="--r:${[-4,3,-2,4,-3,2,-4,3,-2,4][i]}deg"><i class="${h.ic}" style="color:${C(h)}"></i>${sn(h)}</span></div>`).join("")}</div></div>`},

 {id:"X14",t:"Muzlatkich magnitlari",tag:"o'yinchoq · uy",d:"Muzlatkich eshigi: rangli magnit harflar “OFFLINE” deb yozilgan, ostida hobbi magnitlari. Uyga xos, iliq va kulgili.",
  h:()=>{const W="OFFLINE",cols=["#ef4444","#f59e0b","#22c55e","#3b82f6","#a855f7","#ec4899","#0ea5e9"];
   return title(TT)+`<div class="fridge"><div class="word">${[...W].map((ch,i)=>`<span style="--c:${cols[i]};--r:${[-8,6,-4,9,-6,5,-7][i]}deg">${ch}</span>`).join("")}</div><div class="mags">${H.map((h,i)=>`<span class="mg" style="--c:${C(h)};--r:${[-4,3,-2,5,-3,2,-5,4,-1,3][i]}deg"><i class="${h.ic}"></i>${sn(h)}</span>`).join("")}</div></div>`}},

 {id:"X15",t:"Dam olish zari",tag:"o'yin · tasodif",d:"“Roll my weekend” tugmasini bosing — uch zar aylanib, bitta Mind, bitta Body va bitta Creative hobbidan iborat dam olish rejasini chiqaradi.",
  h:()=>title(TT)+`<div class="dice"><div class="cubes" id="cubes">${TK.map(g=>`<div class="cube" data-g="${g}" style="--c:${T[g].c}"><i></i><small>${T[g].n.toUpperCase()}</small></div>`).join("")}</div><div class="dres"><h4>Weekend generator</h4><p id="dtxt"></p><button id="roll">🎲 Roll my weekend</button></div></div>`},

 {id:"X16",t:"Gologramma kartalar",tag:"kolleksiya · porloq",d:"Kolleksion o'yin kartalari: oltin ramka, mavzu turi va “maxsus qobiliyat”. Sichqoncha bilan qimirlatilsa karta 3D egiladi va gologramma nur o'ynaydi.",
  h:()=>title(TT)+`<div class="holo">${H.map(h=>`<div class="hc" style="--c:${C(h)}"><div class="in2"><div class="tp"><span>${sn(h).toUpperCase()}</span><span>${T[h.g].n.toUpperCase()}</span></div><div class="art"><i class="${h.ic}"></i></div><b>Special move</b><small>${h.d}</small></div></div>`).join("")}</div>`},

 {id:"X17",t:"Ob-havo ilovasi",tag:"tanish · kayfiyat",d:"Ob-havo ilovasi kartalari: har bir hobbi o'z “ob-havosi” bilan — Hiking: musaffo osmon, Reading: yomg'irli shinam kun, Singing: iliq kech. Gradusi yo'q.",
  h:()=>{const W={foot:["ri-sun-line","Sunny","linear-gradient(160deg,#38bdf8,#0ea5e9)"],hike:["ri-sun-foggy-line","Clear skies","linear-gradient(160deg,#34d399,#0f766e)"],out:["ri-windy-line","Fresh breeze","linear-gradient(160deg,#67e8f9,#0891b2)"],read:["ri-rainy-line","Cozy rain","linear-gradient(160deg,#64748b,#334155)"],econ:["ri-cloudy-line","Mixed signals","linear-gradient(160deg,#94a3b8,#475569)"],hist:["ri-mist-line","Misty past","linear-gradient(160deg,#a8a29e,#57534e)"],ai:["ri-flashlight-line","Electric","linear-gradient(160deg,#818cf8,#4338ca)"],design:["ri-rainbow-line","Rainbow","linear-gradient(160deg,#f472b6,#a855f7)"],sing:["ri-moon-clear-line","Warm evening","linear-gradient(160deg,#fb7185,#9d174d)"],music:["ri-thunderstorms-line","Rock storm","linear-gradient(160deg,#1f2937,#7f1d1d)"]};
   return title(TT)+`<div class="wx">${H.map(h=>{const [wi,cond,sky]=W[h.k];return `<div class="wc" style="--sky:${sky}"><div class="row"><div><small>${T[h.g].n}</small><b>${sn(h)}</b></div><i class="${h.ic} hi"></i></div><div class="row" style="align-items:flex-end"><span class="cond">${cond}</span><i class="${wi} wi"></i></div></div>`}).join("")}</div>`}},

 {id:"X18",t:"Metro chizig'i",tag:"xarita · tizimli",d:"Uch metro liniyasi — Mind, Body, Creative — va ular kesishadigan “JM Central” bekati. Har bir bekat — hobbi.",
  h:()=>{const L={mind:{y:80,ks:["read","econ","hist","ai"]},body:{y:190,ks:["foot","hike","out"]},art:{y:300,ks:["design","sing","music"]}};const cx=520,cy=190;
   let s=`<svg class="metro" viewBox="0 0 1000 360">`;
   TK.forEach(g=>{const l=L[g];const xs=l.ks.map((_,i)=>i<l.ks.length/2?120+i*150:620+(i-Math.ceil(l.ks.length/2))*150+150);
     const path=g==="body"?`M60,${l.y} L940,${l.y}`:`M60,${l.y} L360,${l.y} L${cx},${cy} L680,${l.y} L940,${l.y}`;
     s+=`<path class="ln" stroke="${T[g].c}" d="${path}"/><text class="ln-lab" x="60" y="${l.y-16}" fill="${T[g].c}">${T[g].n.toUpperCase()} LINE</text>`;
     const pos=g==="body"?[180,330,760]:(l.ks.length===4?[140,280,760,880]:[180,760,880]);
     l.ks.forEach((k,i)=>{const h=f(k),x=pos[i];s+=`<g class="s"><circle class="stn" cx="${x}" cy="${l.y}" r="9"/><text x="${x}" y="${l.y+(g==="art"?30:-14)}" text-anchor="middle">${sn(h)}</text><title>${h.d}</title></g>`})});
   s+=`<circle cx="${cx}" cy="${cy}" r="20" class="stn" style="stroke-width:5"/><circle cx="${cx}" cy="${cy}" r="7" class="hub"/><text x="${cx}" y="${cy+44}" text-anchor="middle" style="font-size:13px">JM Central</text></svg>`;
   return title(TT)+s}},

 {id:"X19",t:"Galereya devori",tag:"san'at · nafis",d:"Muzey devori: har xil o'lchamdagi ramkalar, tepasida yoritgich, ostida ko'rgazma yorlig'i — nomi va qisqa “kurator izohi”.",
  h:()=>{const S=[[110,140],[150,110],[110,110],[130,160],[160,120],[110,140],[140,110],[120,150],[150,120],[110,110]];
   return title(TT)+`<div class="gal">${H.map((h,i)=>`<div class="fr"><div class="frm"><div class="mat"><div class="art" style="--c:${C(h)};--w:${S[i][0]}px;--h:${S[i][1]}px"><i class="${h.ic}"></i></div></div></div><div class="plq"><b>${sn(h)}</b>${h.d}</div></div>`).join("")}</div>`}},

 {id:"X20",t:"Shisha kartalar",tag:"yumshoq · zamonaviy",d:"Orqada sekin suzuvchi uch rangli dog' (Mind ko'k, Body yashil, Creative pushti), ustida xira shisha kartalar. Saytning och fonida juda nafis.",
  h:()=>`<div class="aura"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>${title(TT)}<div class="ag">${H.map(h=>`<div class="gc" style="--c:${C(h)}"><i class="${h.ic}"></i><div><b>${sn(h)}</b><small>${h.d}</small></div></div>`).join("")}</div></div>`}
];

document.getElementById("jump").innerHTML=V.map(v=>`<a href="#${v.id}">${v.id}</a>`).join("");
function render(){document.getElementById("variants").innerHTML=V.map(v=>`<section class="var" id="${v.id}"><div class="vh"><span class="n">${v.id}</span><h2>${v.t}</h2><span class="tag">${v.tag}</span><p>${v.d}</p></div><div class="vb">${v.h()}</div></section>`).join("");wire()}
addEventListener("scroll",()=>{let cur="X1";V.forEach(v=>{const el=document.getElementById(v.id);if(el&&el.getBoundingClientRect().top<160)cur=v.id});document.querySelectorAll(".jump a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur))},{passive:true});

function wire(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.2});
 document.querySelectorAll(".var").forEach(s=>io.observe(s));

 /* X2 wrapped */
 (function(){const wr=document.getElementById("wr"),sl=[...wr.querySelectorAll(".sl")],bars=[...wr.querySelectorAll(".bars i")];let i=0,t;
  const go=n=>{i=(n+sl.length)%sl.length;sl.forEach((s,j)=>s.classList.toggle("on",j===i));bars.forEach((b,j)=>{b.classList.toggle("done",j<i);b.classList.remove("cur");if(j===i){void b.offsetWidth;b.classList.add("cur")}});clearTimeout(t);t=setTimeout(()=>go(i+1),3400)};
  wr.addEventListener("click",()=>go(i+1));go(0)})();

 /* X4 rings */
 const rings=document.getElementById("rings");rings.querySelectorAll("circle.fg").forEach(c=>{const r=+c.getAttribute("r"),L=2*Math.PI*r;c.style.strokeDasharray=L;c.style.strokeDashoffset=L;});
 new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){rings.querySelectorAll("circle.fg").forEach((c,j)=>setTimeout(()=>c.style.strokeDashoffset=0,j*250));o.disconnect()}}),{threshold:.3}).observe(rings);
 rings.querySelectorAll(".rg").forEach(r=>{r.addEventListener("mouseenter",()=>{rings.classList.add("hl");rings.querySelectorAll("circle.fg").forEach(c=>c.classList.toggle("on",c.dataset.g===r.dataset.g))});r.addEventListener("mouseleave",()=>rings.classList.remove("hl"))});

 /* X5 TV */
 (function(){const scr=document.getElementById("scr"),ch=document.getElementById("tvch");let cur=9;
  const tune=n=>{cur=(n+H.length)%H.length;scr.classList.add("zap");document.querySelectorAll("#chlist button").forEach(b=>b.classList.toggle("on",+b.dataset.i===cur));
   setTimeout(()=>{const h=H[cur];ch.style.setProperty("--c",C(h));ch.innerHTML=`<i class="${h.ic}"></i><b>${sn(h)}</b><small>${h.d}</small>`;scr.classList.remove("zap")},280)};
  document.querySelectorAll("#chlist button").forEach(b=>b.addEventListener("click",()=>tune(+b.dataset.i)));
  let rot=0;document.getElementById("knob").addEventListener("click",e=>{rot+=36;e.currentTarget.style.transform=`rotate(${rot}deg)`;tune(cur+1)});tune(9)})();

 /* X10 radio */
 (function(){const tn=document.getElementById("tune"),nd=document.getElementById("needle"),dis=document.getElementById("rdis"),sts=[...document.querySelectorAll("#dial .st")];
  const upd=()=>{const p=tn.value/10;nd.style.left=p+"%";let best=0,bd=1e9;sts.forEach((s,i)=>{const d=Math.abs(parseFloat(s.style.left)-p);if(d<bd){bd=d;best=i}});
   sts.forEach((s,i)=>s.classList.toggle("on",i===best&&bd<3.5));
   if(bd<3.5){const h=H[best];dis.innerHTML=`<i class="${h.ic}"></i>${sn(h).toUpperCase()}<small>${T[h.g].n.toUpperCase()} FM</small>`}else dis.innerHTML=`<i class="ri-radio-line"></i>~ ~ static ~ ~<small>TUNING…</small>`};
  tn.addEventListener("input",upd);upd()})();

 /* X11 vending */
 const lcd=document.getElementById("vlcd"),tray=document.getElementById("vtray");
 document.querySelectorAll(".vi").forEach(v=>v.addEventListener("click",()=>{const h=H[+v.dataset.i];lcd.innerHTML=`ENJOY:<br>${sn(h).toUpperCase()}`;tray.innerHTML=`<span class="can drop" style="width:46px;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:${C(h)}"><i class="${h.ic}"></i></span>`}));

 /* X15 dice */
 const roll=()=>{const pick=g=>{const a=by(g);return a[Math.random()*a.length|0]};const res={};
  document.querySelectorAll("#cubes .cube").forEach((c,i)=>{const h=pick(c.dataset.g);res[c.dataset.g]=h;c.classList.remove("roll");void c.offsetWidth;c.classList.add("roll");setTimeout(()=>c.querySelector("i").className=h.ic,350+i*80)});
  setTimeout(()=>document.getElementById("dtxt").innerHTML=`Saturday morning: <b>${sn(res.body)}</b>. Afternoon with <b>${sn(res.mind)}</b>. Evening: <b>${sn(res.art)}</b>.`,500)};
 document.getElementById("roll").onclick=roll;roll();

 /* X16 holo tilt */
 document.querySelectorAll(".hc").forEach(c=>{c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--rx",(x-.5)*18+"deg");c.style.setProperty("--ry",(.5-y)*18+"deg");c.style.setProperty("--px",x*100+"%");c.style.setProperty("--py",y*100+"%")});c.addEventListener("mouseleave",()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")})});
}
(document.fonts?document.fonts.load('20px remixicon'):Promise.resolve()).then(render,render);
</script>
</body>
</html>
