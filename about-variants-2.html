<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>About — yana 30 ta variant</title>
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"M PLUS 1 Code";font-weight:300 700;font-display:swap;src:url("assets/fonts/mplus1code-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BB-02FF}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg:#e7eeea;--panel:#fff;--surface:#f6f8f7;--surface2:#eef2f0;--line:rgba(15,23,30,.1);--line2:rgba(15,23,30,.18);
  --text:#15181d;--muted:#5b636b;--faint:#8a939a;--accent:#0f9d4f;--accent-text:#0a7d3f;--fill:#18d26e;--soft:rgba(24,210,110,.12);
  --ease:cubic-bezier(.22,1,.36,1);--font:"M PLUS 1 Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  background-image:linear-gradient(rgba(15,157,79,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,157,79,.06) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.top h1{font-size:16px;margin:0;white-space:nowrap}.top h1 b{color:var(--accent)}
.top .prev{font-size:12px;color:var(--muted);white-space:nowrap;text-decoration:none}
.jump{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.jump a:hover,.jump a.on{background:var(--text);color:#fff;border-color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.intro{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 22px;max-width:900px}.intro b{color:var(--text)}
.var{background:var(--panel);border-radius:20px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 18px 40px -30px rgba(15,23,30,.45);scroll-margin-top:70px}
.var::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--fill),#9be8c0 60%,transparent);z-index:3}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 22px 12px;border-bottom:1px dashed var(--line);background:#fbfcfb}
.vh .n{min-width:34px;height:28px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--accent-text);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.vh h2{font-size:16px;margin:0}
.vh .tag{font-size:10.5px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:3px 9px;border-radius:99px}
.vh p{width:100%;margin:0 0 0 44px;font-size:12px;color:var(--muted);line-height:1.5}
.vb{padding:24px 26px 28px;position:relative}
@media(max-width:640px){.vh p{margin-left:0}.vb{padding:18px 16px 22px}}
.stl{margin:0 0 22px}
.stl h3{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.stl h3::after{content:"";width:48px;height:3px;background:var(--accent);border-radius:2px}
.stl small{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.stl small::before,.stl small::after{content:"";width:28px;height:2px;background:var(--accent)}
.stl.light h3,.stl.light small{color:#fff}
.role{font-size:21px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.lead{font-size:14px;line-height:1.75;color:var(--muted);margin:0}
.pass{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:6px 12px;border-radius:99px}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fill);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(24,210,110,.6)}70%{box-shadow:0 0 0 8px rgba(24,210,110,0)}100%{box-shadow:0 0 0 0 rgba(24,210,110,0)}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:12px;font-weight:700;font-size:13px;text-decoration:none;border:1px solid var(--line2);background:#fff;cursor:pointer;font-family:inherit;transition:.2s}
.btn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.btn:hover{transform:translateY(-2px)}
.row2{display:flex;flex-wrap:wrap;gap:10px}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px}
.dl div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;align-self:center}
.dl .v{font-weight:600}
.dl.one{grid-template-columns:1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:600}
.chip i{color:var(--accent)}
.g{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}
.g.r{grid-template-columns:1fr 300px}
@media(max-width:860px){.g,.g.r{grid-template-columns:1fr}.dl{grid-template-columns:1fr}}
.sq{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}

/* B1 resume header */
.rh{text-align:center;border-bottom:2px solid var(--text);padding-bottom:16px;margin-bottom:20px}
.rh h4{font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:.02em;text-transform:uppercase}
.rh .r{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);font-weight:700;margin:6px 0 12px}
.rh .bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 0;font-size:12.5px}
.rh .bar span{padding:0 12px;border-left:1px solid var(--line2)}.rh .bar span:first-child{border:0}
.rh .bar i{color:var(--accent);margin-right:5px}
.cols2{display:grid;grid-template-columns:180px 1fr;gap:26px}
.cols2 h6{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px}
@media(max-width:700px){.cols2{grid-template-columns:1fr;gap:6px}}

/* B2 ring avatar */
.ringav{position:relative;width:260px;height:260px;border-radius:50%;padding:7px;background:conic-gradient(from var(--a),var(--fill),#3b82f6,#9be8c0,var(--fill));animation:rot 6s linear infinite}
@keyframes rot{to{--a:360deg}}
.ringav img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid #fff}
.ringav .st{position:absolute;right:26px;bottom:26px;width:26px;height:26px;border-radius:50%;background:var(--fill);border:5px solid #fff}

/* B3 spec strip */
.strip{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;margin:20px 0}
.strip div{flex:1 0 auto;padding:12px 18px;border-left:1px solid var(--line);min-width:140px}
.strip div:first-child{border-left:0;padding-left:0}
.strip small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:4px}
.strip b{font-size:13px;white-space:nowrap}

/* B4 card stack */
.stack{position:relative;max-width:300px;margin:10px 0 0 10px}
.stack .back{position:absolute;inset:0;border-radius:18px;background:linear-gradient(140deg,var(--fill),#3b82f6);transform:rotate(-6deg) translate(-12px,8px);opacity:.85;transition:transform .4s var(--ease)}
.stack:hover .back{transform:rotate(-9deg) translate(-18px,12px)}
.stack img{position:relative;border-radius:18px;aspect-ratio:1;object-fit:cover;box-shadow:0 18px 30px -16px rgba(0,0,0,.45)}

/* B5 overlap */
.ovl{display:grid;grid-template-columns:repeat(12,1fr);align-items:center}
.ovl .pic{grid-column:6/13;grid-row:1}
.ovl .pic img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 20%;border-radius:18px}
.ovl .card{grid-column:1/8;grid-row:1;background:#fff;border-radius:18px;padding:24px;box-shadow:0 24px 40px -24px rgba(0,0,0,.45);border:1px solid var(--line);position:relative;z-index:1}
@media(max-width:860px){.ovl{display:block}.ovl .card{margin-top:-60px;position:relative}}

/* B6 speech */
.sp{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.sp img{border-radius:50%;aspect-ratio:1;object-fit:cover}
.bubble{position:relative;background:var(--surface);border-radius:20px;padding:20px 22px}
.bubble::before{content:"";position:absolute;left:-14px;top:40px;border:14px solid transparent;border-right-color:var(--surface);border-left:0}
@media(max-width:760px){.sp{grid-template-columns:1fr}.sp img{max-width:160px}.bubble::before{display:none}}

/* B7 mini timeline */
.tl{position:relative;padding-left:22px;margin:16px 0}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl div{position:relative;margin-bottom:14px}
.tl div::before{content:"";position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl div.now::before{background:var(--fill)}
.tl small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);font-weight:700}
.tl p{margin:3px 0 0;font-size:13.5px;line-height:1.65;color:var(--muted)}

/* B8 two cards */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.two .c{border-radius:16px;padding:18px;border:1px solid var(--line)}
.two .c.dk{background:var(--text);color:#fff;border:0}.two .c.dk .pass{color:#b8c1bc}
.two h6{margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:760px){.two{grid-template-columns:1fr}}

/* B9 hover reveal */
.rev{position:relative;border-radius:18px;overflow:hidden;max-width:320px}
.rev img{aspect-ratio:1;object-fit:cover;transition:transform .6s var(--ease)}
.rev .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,18,16,.92),rgba(13,18,16,.55));color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;opacity:0;transition:opacity .4s}
.rev:hover .ov{opacity:1}.rev:hover img{transform:scale(1.06)}
.rev .ov div{font-size:12px;display:flex;gap:8px}.rev .ov i{color:var(--fill)}
.revhint{font-size:11.5px;color:var(--faint);margin-top:8px}

/* B10 chips around photo */
.orbit{position:relative;width:min(440px,90vw);aspect-ratio:1;margin:0 auto}
.orbit img{position:absolute;inset:22%;width:56%;height:56%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px #fff,0 0 0 8px var(--fill)}
.orbit .ch{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 8px 14px -10px rgba(0,0,0,.35);display:flex;gap:6px;align-items:center}
.orbit .ch i{color:var(--accent)}

/* B11 typing */
.typ{font-size:clamp(26px,4.4vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 14px}
.typ .w{color:var(--accent);border-right:3px solid var(--accent);padding-right:4px;animation:car 1s steps(2) infinite}
@keyframes car{50%{border-color:transparent}}

/* B12 notion */
.no{max-width:880px;margin:0 auto}
.no .cov{height:120px;border-radius:10px;background:linear-gradient(120deg,#d9f7e6,#e0ecff 60%,#fdeef6)}
.no img.ic{width:84px;height:84px;border-radius:14px;object-fit:cover;margin:-42px 0 0 24px;border:4px solid #fff;position:relative}
.no h4{font-size:30px;margin:10px 0 14px 4px}
.no .props{display:grid;grid-template-columns:150px 1fr;row-gap:2px;font-size:13px;margin-bottom:14px}
.no .props>span{color:var(--faint);display:flex;align-items:center;gap:8px;padding:6px 4px}
.no .props>b{font-weight:500;padding:6px 8px;border-radius:6px}
.no .props>b:hover{background:var(--surface)}
.no .tg{display:inline-block;padding:1px 8px;border-radius:4px;background:#dbeafe;color:#1d4ed8;font-size:12px;margin-right:4px}
.no .tg.tgG{background:#dcfce7;color:#166534}.no .tg.tgP{background:#fce7f3;color:#9d174d}
.no hr{border:0;border-top:1px solid var(--line);margin:8px 0 14px}

/* B13 github */
.gh{display:grid;grid-template-columns:260px 1fr;gap:24px}
.gh aside img{border-radius:50%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line2)}
.gh aside h4{margin:12px 0 0;font-size:22px}.gh aside .u{color:var(--faint);font-size:15px}
.gh aside .bt{width:100%;justify-content:center;margin:12px 0}
.gh aside .m{font-size:13px;display:flex;gap:8px;align-items:center;padding:3px 0;color:var(--muted)}
.gh .readme{border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.gh .readme .hd{padding:10px 14px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted);background:var(--surface)}
.gh .readme .bd{padding:16px 20px;font-size:13.5px;line-height:1.7}
.gh .readme h5{font-size:20px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.gh .readme ul{padding-left:20px;margin:8px 0}
.gh .readme code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12px}
@media(max-width:760px){.gh{grid-template-columns:1fr}.gh aside img{max-width:180px}}

/* B14 ID card */
.idc{max-width:640px;margin:0 auto;border-radius:16px;background:linear-gradient(135deg,#e8f6ee,#fff 55%,#e6efff);border:1px solid var(--line2);padding:16px 18px;box-shadow:0 20px 34px -24px rgba(0,0,0,.5);position:relative;overflow:hidden}
.idc::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 80% 40%,rgba(15,157,79,.06) 0 2px,transparent 2px 9px);pointer-events:none}
.idc .hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--accent-text);border-bottom:1px solid var(--line2);padding-bottom:8px;margin-bottom:12px}
.idc .bd{display:grid;grid-template-columns:130px 1fr;gap:16px;position:relative}
.idc img{border-radius:8px;aspect-ratio:3/4;object-fit:cover;filter:saturate(.9)}
.idc .f{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.idc .f small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--faint);font-weight:700}
.idc .f b{font-size:12.5px}
.idc .mrz{margin-top:12px;font-size:12.5px;letter-spacing:.18em;color:#374151;background:rgba(255,255,255,.7);border-radius:6px;padding:7px 10px;line-height:1.5;word-break:break-all}
@media(max-width:560px){.idc .bd{grid-template-columns:1fr}.idc img{max-width:140px}}

/* B15 lanyard badge */
.lan{display:flex;flex-direction:column;align-items:center}
.lan .strap{width:34px;height:70px;background:repeating-linear-gradient(45deg,var(--accent) 0 8px,var(--fill) 8px 16px)}
.lan .clip{width:46px;height:20px;border-radius:6px;background:linear-gradient(#d1d5db,#9ca3af);margin-top:-2px}
.lan .badge{width:270px;border-radius:18px;background:#fff;box-shadow:0 24px 40px -20px rgba(0,0,0,.5);overflow:hidden;margin-top:-6px;text-align:center;border:1px solid var(--line);animation:sw 5s ease-in-out infinite;transform-origin:50% -80px}
@keyframes sw{50%{transform:rotate(2deg)}}
.lan .badge .btop{background:var(--text);color:#fff;font-size:10.5px;letter-spacing:.22em;padding:10px;font-weight:700}
.lan .badge img{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:16px auto 10px;box-shadow:0 0 0 4px var(--fill)}
.lan .badge h4{margin:0;font-size:18px}.lan .badge p{margin:4px 14px 12px;font-size:11.5px;color:var(--muted)}
.lan .badge .bot{background:var(--accent);color:#fff;font-size:11px;letter-spacing:.2em;padding:8px;font-weight:700}

/* B16 text only */
.txo{max-width:780px;margin:0 auto;text-align:center}
.txo img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 14px}
.txo .lead{font-size:16px}
.txo .chips{justify-content:center;margin:18px 0}

/* B17 photo in facts grid */
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fg .ph{grid-column:span 2;grid-row:span 2;border-radius:16px;overflow:hidden;position:relative;min-height:230px}
.fg .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.fg .f{border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:100px}
.fg .f i{color:var(--accent);font-size:18px}
.fg .f small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.fg .f b{font-size:13px;word-break:break-word}
.fg .bio{grid-column:1/-1;border-radius:14px;padding:16px;border:1px solid var(--line)}
@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}}

/* B18 mesh */
.mesh{border-radius:18px;padding:26px;background:radial-gradient(at 15% 20%,#d9f7e6 0,transparent 50%),radial-gradient(at 85% 10%,#e0ecff 0,transparent 50%),radial-gradient(at 70% 90%,#fdeef6 0,transparent 50%),#fafcfb;margin:-4px}
.mesh .g img{border-radius:50%;box-shadow:0 20px 40px -20px rgba(15,23,30,.45)}

/* B19 diagonal */
.diag{display:grid;grid-template-columns:44% 1fr;min-height:470px;margin:-24px -26px -28px}
.diag .pic{background:url(assets/img/opt/11111.webp) center 20%/cover;clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.diag .txt{padding:28px 30px 28px 6px}
@media(max-width:860px){.diag{grid-template-columns:1fr;margin:0}.diag .pic{min-height:300px;clip-path:none;border-radius:14px}.diag .txt{padding:20px 0 0}}

/* B20 vertical name */
.vert{display:grid;grid-template-columns:60px 300px 1fr;gap:24px;align-items:start}
.vert .vn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:46px;font-weight:700;letter-spacing:.06em;color:var(--surface2);-webkit-text-stroke:1.5px var(--line2);line-height:1;text-transform:uppercase}
@media(max-width:860px){.vert{grid-template-columns:1fr}.vert .vn{writing-mode:horizontal-tb;transform:none;font-size:34px}}

/* B21 apple */
.apl{text-align:center}
.apl .big{font-size:clamp(28px,4.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:0 auto 18px;max-width:880px}
.apl .big span{background:linear-gradient(90deg,var(--accent),#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.apl .wide{height:280px;border-radius:24px;background:url(assets/img/opt/11111.webp) center 25%/cover;margin:0 auto 20px;max-width:900px}
.apl .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left;max-width:900px;margin:0 auto}
.apl .tri h6{margin:0 0 6px;font-size:13px}
@media(max-width:760px){.apl .tri{grid-template-columns:1fr}}

/* B22 vertical tabs */
.vt{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.vt nav{display:flex;flex-direction:column;gap:4px}
.vt nav img{border-radius:14px;margin-bottom:10px;aspect-ratio:1;object-fit:cover}
.vt nav button{font-family:inherit;text-align:left;font-size:13px;font-weight:600;padding:10px 12px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--muted);display:flex;gap:9px;align-items:center}
.vt nav button.on{background:var(--surface);color:var(--text)}.vt nav button.on i{color:var(--accent)}
.vt .pn{animation:fd .35s var(--ease)}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media(max-width:760px){.vt{grid-template-columns:1fr}.vt nav{flex-direction:row;flex-wrap:wrap}.vt nav img{display:none}}

/* B23 phone contact */

.phone .acts i{font-size:16px}
.phone .grp{background:#fff;border-radius:12px;margin-bottom:8px}
.phone .grp div{padding:8px 12px;font-size:12px;border-bottom:1px solid #e5e7eb}
.phone .grp div:last-child{border:0}
.phone .grp small{display:block;font-size:10px;color:var(--muted)}
.phone .grp a,.phone .grp span{color:#2563eb}

/* B24 text over photo */
.top2{position:relative;border-radius:18px;overflow:hidden;min-height:480px;background:#6b6b6b url(assets/img/opt/11111.webp) right center/contain no-repeat;margin:-4px;display:flex;align-items:center}

.top2 .t{position:relative;max-width:560px;padding:26px;color:#fff}
.top2 .lead,.top2 .pass{color:#c3cbc6}
.top2 .chip{background:rgba(255,255,255,.1);color:#fff}

/* B25 masonry */
.mas{columns:3 240px;column-gap:12px}
.mas>div{break-inside:avoid;margin-bottom:12px;border-radius:14px;padding:16px;background:var(--surface)}
.mas>div.ph{padding:0;overflow:hidden}
.mas>div.dk{background:var(--text);color:#fff}.mas>div.dk .pass{color:#b8c1bc}
.mas small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;display:block;margin-bottom:6px}
.mas b{font-size:14px}

/* B26 hexagon */
.hex{width:280px;aspect-ratio:.866;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--fill);padding:6px}
.hex img{width:100%;height:100%;object-fit:cover;clip-path:inherit}

/* B27 two-tone */
.tt{display:grid;grid-template-columns:38% 1fr;margin:-24px -26px -28px;min-height:460px}
.tt .l{background:linear-gradient(160deg,#0f9d4f,#0a6b37);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.tt .l img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid rgba(255,255,255,.35)}
.tt .l h4{font-size:30px;margin:0;line-height:1.05}
.tt .l .r{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.tt .rr{padding:28px}
@media(max-width:860px){.tt{grid-template-columns:1fr;margin:0}.tt .l{border-radius:14px}.tt .rr{padding:20px 0 0}}

/* B28 expanding rows */
.xr .it{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);transition:padding .3s var(--ease),background .3s}
.xr .it:hover{background:var(--surface);padding-left:14px}
.xr .it .ic{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;transition:background .3s}
.xr .it:hover .ic{background:var(--text)}
.xr .it .ic i{color:var(--muted);transition:color .3s}.xr .it:hover .ic i{color:var(--fill)}
.xr .it small{width:110px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.xr .it b{font-size:14px}

/* B29 signature */
.sig svg{width:220px;height:auto;margin-top:12px}
.sig path{fill:none;stroke:var(--accent-text);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900}
.sig.in path{animation:dr 2.6s var(--ease) forwards}
@keyframes dr{to{stroke-dashoffset:0}}

/* B30 strip */
.ab{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.ab img{width:84px;height:84px;border-radius:50%;object-fit:cover}
.ab .mid{flex:1;min-width:260px}
.ab .mid b{font-size:18px;display:block}.ab .mid span{font-size:13px;color:var(--muted)}
.ab .chips{margin-top:10px}
.abmore{margin-top:14px}
.abmore summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent-text);list-style:none}
.abmore summary::-webkit-details-marker{display:none}
.abmore p{margin-top:10px}
</style>

(function(){const el=document.getElementById("typ"),R=[["an","IT Project Manager"],["a","Java Backend Developer"],["an","Aviation IT specialist"]];let i=0,j=R[0][1].length,del=true;
 const art=el.previousSibling;
 (function tick(){const w=R[i][1];if(del){j--;if(j<0){i=(i+1)%R.length;del=false;j=0;art.textContent="I'm "+R[i][0]+" "}}else{j++;if(j>R[i][1].length){del=true;setTimeout(tick,1500);return}}
  el.textContent=R[i][1].slice(0,Math.max(0,j));setTimeout(tick,del?40:75)})()})();

new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.disconnect()}}),{threshold:.6}).observe(document.getElementById("sig"));
